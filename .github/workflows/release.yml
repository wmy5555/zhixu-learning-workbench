name: Release preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-preview
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Create immutable version tag and preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(node scripts/release-notes.mjs "$RUNNER_TEMP/release-notes.md")
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$GITHUB_SHA" || { echo 'main changed; rerun the workflow on its latest commit'; exit 1; }
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          gh release create "$tag" --verify-tag --prerelease --title "知序 $tag · 开发预览" --notes-file "$RUNNER_TEMP/release-notes.md"
