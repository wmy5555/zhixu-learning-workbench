name: Android prototype
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Android build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm android:sync
      - name: Build prototype and storage tests
        working-directory: apps/android/android
        run: bash gradlew --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-shared-ui-prototype
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/android/android/app/build/outputs/apk/debug/*.apk
            apps/android/android/app/build/outputs/apk/androidTest/debug/*.apk
            apps/android/android/app/build/reports/lint-results-debug.html
