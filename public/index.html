<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#173a45" />
    <title>知序 · 个人学习工作台</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/onboarding.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="主要导航">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">知</span>
          <span><strong>知序</strong><small>个人学习工作台</small></span>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="夜间模式" aria-pressed="false" title="切换夜间模式">
            <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
            <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 13.1A9 9 0 0 1 10.9 3.2 9 9 0 1 0 20.8 13.1Z"/></svg>
          </button>
        </div>
        <nav class="nav-list" id="nav-list">
          <button class="nav-item is-active" data-view="today"><span>◫</span>今日</button>
          <button class="nav-item" data-view="capture"><span>＋</span>收集与加工</button>
          <button class="nav-item" data-view="library"><span>▤</span>知识库</button>
          <button class="nav-item" data-view="study"><span>◉</span>学习与错题</button>
          <button class="nav-item" data-view="topics"><span>◇</span>主题学习包</button>
          <button class="nav-item" data-view="discover"><span>⌁</span>检索与发现</button>
          <button class="nav-item" data-view="output"><span>✦</span>问答与输出</button>
          <button class="nav-item" data-view="system"><span>⚙</span>系统</button>
        </nav>
        <div class="sidebar-foot">
          <div class="privacy-chip"><span class="status-dot"></span>本地优先</div>
          <p>外部材料只作为数据处理</p>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <button class="icon-button menu-button" id="menu-button" aria-label="打开导航">☰</button>
          <div>
            <p class="eyebrow" id="page-eyebrow">今日工作台</p>
            <h1 id="page-title">把注意力留给值得学习的内容</h1>
          </div>
          <div class="top-actions">
            <button class="quiet-button" id="global-refresh">刷新</button>
            <button class="primary-button compact" id="quick-capture">快速收集</button>
          </div>
        </header>
        <main id="main" tabindex="-1" aria-live="polite">
          <div class="loading-panel"><span class="spinner"></span><p>正在读取本地知识库…</p></div>
        </main>
      </div>
    </div>

    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside class="drawer" id="drawer" aria-label="详细信息" aria-hidden="true">
      <header class="drawer-header">
        <div><p class="eyebrow" id="drawer-eyebrow">详情</p><h2 id="drawer-title">查看内容</h2></div>
        <button class="icon-button" id="drawer-close" aria-label="关闭">×</button>
      </header>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <button class="help-launcher" id="help-launcher" type="button" aria-label="打开使用指南" aria-haspopup="dialog" aria-controls="help-dialog" title="使用指南"><span aria-hidden="true">?</span></button>
    <dialog class="help-dialog" id="help-dialog" aria-labelledby="help-title">
      <header class="help-dialog-header">
        <h2 id="help-title">使用指南</h2>
        <div class="item-actions">
          <button id="onboarding-launcher" class="quiet-button compact" type="button">新手实操引导</button>
          <button id="onboarding-reset" class="quiet-button compact" type="button">重新练习</button>
          <a href="/guide.html" target="_blank" rel="noopener" class="help-open-page">单独打开 ↗</a>
          <button class="icon-button" id="help-close" type="button" aria-label="关闭使用指南" autofocus>×</button>
        </div>
      </header>
      <iframe id="help-frame" title="知序新手使用指南"></iframe>
    </dialog>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    <noscript>此应用需要启用 JavaScript。</noscript>
    <script type="module" src="/app.mjs"></script>
    <script type="module" src="/help.mjs"></script>
  </body>
</html>
