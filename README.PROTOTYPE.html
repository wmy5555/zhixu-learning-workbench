<script type="application/json" id="prototype-data">[{"key":"A","name":"上手优先","disclosure":"全文展开","hypothesis":"先把项目运行起来，再逐步了解功能。","tradeoff":"上手路径最短，学习方法需要继续向下阅读。","seed":"c3dd7e99-c2aa-4870-96a0-429092c94d1257e4f1b4-d082-4c14-be07-650cc9e5ec2a","order":["快速开始","知序能做什么","走完一条学习流程","AI 与隐私","当前状态","文档与开发","参与贡献"],"markdown":"\u003c!-- README UI 原型 A，仅供比较；不替换正式 README，不加入许可证、图片或图片徽章。 -->\n\n# 知序学习工作台\n\n把收集的资料，变成自己的理解，再用到下一次学习、写作和决策中。\n\n知序是一个本地优先的中文个人学习工作台。你可以保存原文、整理知识、练习与复习，并带着来源检索和输出；AI 按需参与，资料和学习记录保存在自己的电脑上。\n\n**开发预览 v0.1.0 · 本地运行 · 中文界面与文档**\n\n[快速开始](#快速开始) · [使用指南](public/guide.html) · [更新记录](CHANGELOG.md) · [CI 检查](https://github.com/wmy5555/zhixu-learning-workbench/actions/workflows/ci.yml)\n\n## 目录\n\n- [快速开始](#快速开始)\n- [知序能做什么](#知序能做什么)\n- [走完一条学习流程](#走完一条学习流程)\n- [AI 与隐私](#ai-与隐私)\n- [当前状态](#当前状态)\n- [文档与开发](#文档与开发)\n- [参与贡献](#参与贡献)\n\n## 快速开始\n\n需要 **Node.js 24** 和 **pnpm 11.19.0**。网页版直接运行，无需构建。\n\n### 获取并运行\n\n已下载仓库的读者可直接进入项目目录；使用 Git 获取项目时运行：\n\n```sh\ngit clone https://github.com/wmy5555/zhixu-learning-workbench.git\ncd zhixu-learning-workbench\nnpm install --global pnpm@11.19.0\npnpm install --frozen-lockfile\npnpm start\n```\n\n打开 [http://127.0.0.1:4318](http://127.0.0.1:4318)。服务默认仅监听本机回环地址。\n\n### Windows 脚本入口\n\n安装 Node.js 24 后，也可以在项目目录中依次双击：\n\n1. `install.cmd`：安装锁定依赖，首次使用或依赖更新后运行。\n2. `start.cmd`：后台启动服务并打开浏览器。\n3. `stop.cmd`：需要停止后台服务时运行。\n\n关闭浏览器不会停止后台服务；电脑关机或休眠时不保证执行复习调度。\n\n### 第一次打开\n\n先检查资料文件夹、时区和每日学习时间，再保存一小段自己的材料。没有模型密钥也可以收集、编辑、本地查找、手动整理，并保留自己的回答与笔记。\n\n需要 AI 时，在设置中配置相应服务。Linux/macOS 保存供应商凭据前需设置私有的 `LEARNING_MASTER_KEY`，详见 [.env.example](.env.example)。应用不会自动加载 `.env`；已自行配置该文件时可显式运行：\n\n```sh\nnode --env-file=.env src/server.mjs\n```\n\n## 知序能做什么\n\n适合希望把读书摘录、网页材料、课程笔记和 AI 对话持续消化，而不只是收藏起来的个人学习者。\n\n| 你想做的事 | 知序提供的帮助 |\n| --- | --- |\n| 留住原文与出处 | 粘贴文字、导入 UTF-8 文本或 Markdown，保留来源，随时回看原文。 |\n| 整理值得学习的内容 | 按需用 AI 拆解概念、主张、方法与问题；主动联网核验时保留证据、分歧和适用条件。 |\n| 练习并安排复习 | 组织学习主题，亲自作答，记录反馈与修正，按计划复习。 |\n| 形成自己的理解 | 将自己的回答、AI 建议和最终确认的理解分别保存。 |\n| 重新找到并使用知识 | 本地检索、来源回看、引用输出；可选接入向量检索与 MCP。 |\n| 管理自己的资料 | 内容以 Markdown 保存，学习与任务记录存入 SQLite，支持 Obsidian 外部编辑和备份恢复。 |\n\n原始资料、结构化材料和个人理解分别保留。保存一篇资料，不等于已经学会；AI 生成的答案也不会自动成为你已确认的个人理解。\n\n## 走完一条学习流程\n\n1. **收集**：保存一段原文，并补充出处。\n2. **整理**：按需运行 AI 拆解，阅读结果；需要核验时，主动检索并查看证据和限制。\n3. **选择**：决定留作参考、暂存候选，还是加入学习安排。\n4. **学习**：自己解释或作答，阅读反馈，再确认自己的理解。\n5. **复习与应用**：回到到期知识，修正误解；检索材料并带着引用形成输出。\n\n想跟着操作，可以从今日页或帮助入口开始新手引导。引导在独立练习库中进行；教程中的 AI 请求仍使用真实服务与预算，可能产生费用。完整步骤见 [新手实操说明](docs/ONBOARDING.md)。\n\n## AI 与隐私\n\n- **本地保存**：资料与学习记录保存在本机。不要把 `.data/`、`vault/`、`.env`、凭据或个人备份上传到公共仓库。\n- **按需启用**：模型、搜索、网页读取和向量能力分别配置。主动使用 AI 功能时，会向所配置的服务发送完成该操作所需的内容；联网核验还需搜索和网页读取能力。\n- **费用可查**：连接测试与模型调用可能收费。可查看用量、设置请求上限与预算；缺失用量或单价时，费用保留为未知。\n- **外部访问单独授权**：MCP 与 ChatGPT 接入默认关闭，需主动启用。允许 ChatGPT 读取知识后，内容会进入 ChatGPT 上下文，详见 [ChatGPT 连接说明](docs/CHATGPT_MCP.md)。\n\n更多说明：[文件、隐私与备份](docs/DATA.md) · [服务配置](docs/PROVIDERS.md) · [用量与费用](docs/USAGE.md)\n\n## 当前状态\n\n当前为 **v0.1.0 开发预览版**，主要面向本机单用户使用。本 README 介绍本地网页版；具体功能覆盖与验收边界以 [需求覆盖](docs/COVERAGE.md) 和 [测试记录](docs/TEST_RESULTS.md) 为准。\n\n本地测试和受控模拟不能代表你的供应商已经接通。真实资料的联网核验、语义检索和教学反馈质量仍需单独验收。\n\n当前维护中文 README，不提供尚未完成的英文版链接。版本变化见 [CHANGELOG](CHANGELOG.md)。\n\n## 文档与开发\n\n| 想了解什么 | 从这里开始 |\n| --- | --- |\n| 日常使用与排障 | [使用指南](public/guide.html)、[新手引导](docs/ONBOARDING.md) |\n| 数据、文件与恢复 | [数据说明](docs/DATA.md)、[附件说明](docs/SOURCE_FILES.md) |\n| 模型、搜索与外部工具 | [服务配置](docs/PROVIDERS.md)、[MCP](docs/MCP.md)、[ChatGPT 接入](docs/CHATGPT_MCP.md) |\n| 代码结构与接口 | [架构说明](docs/ARCHITECTURE.md) |\n| 功能边界与验收证据 | [需求覆盖](docs/COVERAGE.md)、[测试记录](docs/TEST_RESULTS.md) |\n| 版本与维护流程 | [更新记录](CHANGELOG.md)、[维护说明](docs/MAINTENANCE.md) |\n\n主要技术栈：Node.js 24、ESM、原生 HTML/CSS/JavaScript、Markdown 与 SQLite。\n\n在项目目录运行：\n\n```sh\npnpm check\npnpm test\npnpm quality\n```\n\n完整验证入口与运行依赖审计：\n\n```sh\npnpm verify\npnpm audit --prod --audit-level high\n```\n\n`verify` 依次运行仓库检查、全部测试和本地检索质量检查。日常修改按影响范围选择检查，PR 与合并遵循项目规则。Linux/macOS 的加密测试使用临时随机主密钥，不复用真实凭据。\n\n## 参与贡献\n\n欢迎通过 [Issue](https://github.com/wmy5555/zhixu-learning-workbench/issues) 反馈问题或提出建议。描述实际现象、复现步骤和期望结果即可；示例请使用合成资料，移除个人内容与凭据。\n\n提交代码前请阅读 [贡献指南](CONTRIBUTING.md) 和 [维护说明](docs/MAINTENANCE.md)；AI Agent 还需遵循 [AGENTS.md](AGENTS.md)。\n\n1. 获取仓库，在最新 `main` 上创建聚焦单一问题的分支。\n2. 完成修改，按影响范围验证，并补充必要的文档与更新记录。\n3. 推送分支，按项目约定提交 Pull Request；维护 Agent 遵循北京时间每日 02:00 的集中 PR 节奏。\n\n发现安全问题，请按 [安全报告说明](SECURITY.md) 处理，不在公开 Issue 中粘贴敏感信息。\n","html":"\u003ch1 id=\"知序学习工作台\">知序学习工作台\u003c/h1>\n\u003cp>把收集的资料，变成自己的理解，再用到下一次学习、写作和决策中。\u003c/p>\n\u003cp>知序是一个本地优先的中文个人学习工作台。你可以保存原文、整理知识、练习与复习，并带着来源检索和输出；AI 按需参与，资料和学习记录保存在自己的电脑上。\u003c/p>\n\u003cp>\u003cstrong>开发预览 v0.1.0 · 本地运行 · 中文界面与文档\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#快速开始\">快速开始\u003c/a> · \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/public/guide.html\">使用指南\u003c/a> · \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/CHANGELOG.md\">更新记录\u003c/a> · \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/actions/workflows/ci.yml\">CI 检查\u003c/a>\u003c/p>\n\u003ch2 id=\"目录\">目录\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"#快速开始\">快速开始\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#知序能做什么\">知序能做什么\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#走完一条学习流程\">走完一条学习流程\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#ai-与隐私\">AI 与隐私\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#当前状态\">当前状态\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#文档与开发\">文档与开发\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#参与贡献\">参与贡献\u003c/a>\u003c/li>\u003c/ul>\n\u003ch2 id=\"快速开始\">快速开始\u003c/h2>\n\u003cp>需要 \u003cstrong>Node.js 24\u003c/strong> 和 \u003cstrong>pnpm 11.19.0\u003c/strong>。网页版直接运行，无需构建。\u003c/p>\n\u003ch3 id=\"获取并运行\">获取并运行\u003c/h3>\n\u003cp>已下载仓库的读者可直接进入项目目录；使用 Git 获取项目时运行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">git clone https://github.com/wmy5555/zhixu-learning-workbench.git\ncd zhixu-learning-workbench\nnpm install --global pnpm@11.19.0\npnpm install --frozen-lockfile\npnpm start\u003c/code>\u003c/pre>\n\u003cp>打开 \u003ca href=\"http://127.0.0.1:4318\">http://127.0.0.1:4318\u003c/a>。服务默认仅监听本机回环地址。\u003c/p>\n\u003ch3 id=\"windows-脚本入口\">Windows 脚本入口\u003c/h3>\n\u003cp>安装 Node.js 24 后，也可以在项目目录中依次双击：\u003c/p>\n\u003col>\u003cli>\u003ccode>install.cmd\u003c/code>：安装锁定依赖，首次使用或依赖更新后运行。\u003c/li>\u003cli>\u003ccode>start.cmd\u003c/code>：后台启动服务并打开浏览器。\u003c/li>\u003cli>\u003ccode>stop.cmd\u003c/code>：需要停止后台服务时运行。\u003c/li>\u003c/ol>\n\u003cp>关闭浏览器不会停止后台服务；电脑关机或休眠时不保证执行复习调度。\u003c/p>\n\u003ch3 id=\"第一次打开\">第一次打开\u003c/h3>\n\u003cp>先检查资料文件夹、时区和每日学习时间，再保存一小段自己的材料。没有模型密钥也可以收集、编辑、本地查找、手动整理，并保留自己的回答与笔记。\u003c/p>\n\u003cp>需要 AI 时，在设置中配置相应服务。Linux/macOS 保存供应商凭据前需设置私有的 \u003ccode>LEARNING_MASTER_KEY\u003c/code>，详见 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/.env.example\">.env.example\u003c/a>。应用不会自动加载 \u003ccode>.env\u003c/code>；已自行配置该文件时可显式运行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">node --env-file=.env src/server.mjs\u003c/code>\u003c/pre>\n\u003ch2 id=\"知序能做什么\">知序能做什么\u003c/h2>\n\u003cp>适合希望把读书摘录、网页材料、课程笔记和 AI 对话持续消化，而不只是收藏起来的个人学习者。\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>你想做的事\u003c/th>\u003cth>知序提供的帮助\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>留住原文与出处\u003c/td>\u003ctd>粘贴文字、导入 UTF-8 文本或 Markdown，保留来源，随时回看原文。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>整理值得学习的内容\u003c/td>\u003ctd>按需用 AI 拆解概念、主张、方法与问题；主动联网核验时保留证据、分歧和适用条件。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>练习并安排复习\u003c/td>\u003ctd>组织学习主题，亲自作答，记录反馈与修正，按计划复习。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>形成自己的理解\u003c/td>\u003ctd>将自己的回答、AI 建议和最终确认的理解分别保存。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>重新找到并使用知识\u003c/td>\u003ctd>本地检索、来源回看、引用输出；可选接入向量检索与 MCP。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>管理自己的资料\u003c/td>\u003ctd>内容以 Markdown 保存，学习与任务记录存入 SQLite，支持 Obsidian 外部编辑和备份恢复。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>原始资料、结构化材料和个人理解分别保留。保存一篇资料，不等于已经学会；AI 生成的答案也不会自动成为你已确认的个人理解。\u003c/p>\n\u003ch2 id=\"走完一条学习流程\">走完一条学习流程\u003c/h2>\n\u003col>\u003cli>\u003cstrong>收集\u003c/strong>：保存一段原文，并补充出处。\u003c/li>\u003cli>\u003cstrong>整理\u003c/strong>：按需运行 AI 拆解，阅读结果；需要核验时，主动检索并查看证据和限制。\u003c/li>\u003cli>\u003cstrong>选择\u003c/strong>：决定留作参考、暂存候选，还是加入学习安排。\u003c/li>\u003cli>\u003cstrong>学习\u003c/strong>：自己解释或作答，阅读反馈，再确认自己的理解。\u003c/li>\u003cli>\u003cstrong>复习与应用\u003c/strong>：回到到期知识，修正误解；检索材料并带着引用形成输出。\u003c/li>\u003c/ol>\n\u003cp>想跟着操作，可以从今日页或帮助入口开始新手引导。引导在独立练习库中进行；教程中的 AI 请求仍使用真实服务与预算，可能产生费用。完整步骤见 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/ONBOARDING.md\">新手实操说明\u003c/a>。\u003c/p>\n\u003ch2 id=\"ai-与隐私\">AI 与隐私\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>本地保存\u003c/strong>：资料与学习记录保存在本机。不要把 \u003ccode>.data/\u003c/code>、\u003ccode>vault/\u003c/code>、\u003ccode>.env\u003c/code>、凭据或个人备份上传到公共仓库。\u003c/li>\u003cli>\u003cstrong>按需启用\u003c/strong>：模型、搜索、网页读取和向量能力分别配置。主动使用 AI 功能时，会向所配置的服务发送完成该操作所需的内容；联网核验还需搜索和网页读取能力。\u003c/li>\u003cli>\u003cstrong>费用可查\u003c/strong>：连接测试与模型调用可能收费。可查看用量、设置请求上限与预算；缺失用量或单价时，费用保留为未知。\u003c/li>\u003cli>\u003cstrong>外部访问单独授权\u003c/strong>：MCP 与 ChatGPT 接入默认关闭，需主动启用。允许 ChatGPT 读取知识后，内容会进入 ChatGPT 上下文，详见 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/CHATGPT_MCP.md\">ChatGPT 连接说明\u003c/a>。\u003c/li>\u003c/ul>\n\u003cp>更多说明：\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/DATA.md\">文件、隐私与备份\u003c/a> · \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/PROVIDERS.md\">服务配置\u003c/a> · \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/USAGE.md\">用量与费用\u003c/a>\u003c/p>\n\u003ch2 id=\"当前状态\">当前状态\u003c/h2>\n\u003cp>当前为 \u003cstrong>v0.1.0 开发预览版\u003c/strong>，主要面向本机单用户使用。本 README 介绍本地网页版；具体功能覆盖与验收边界以 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/COVERAGE.md\">需求覆盖\u003c/a> 和 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/TEST_RESULTS.md\">测试记录\u003c/a> 为准。\u003c/p>\n\u003cp>本地测试和受控模拟不能代表你的供应商已经接通。真实资料的联网核验、语义检索和教学反馈质量仍需单独验收。\u003c/p>\n\u003cp>当前维护中文 README，不提供尚未完成的英文版链接。版本变化见 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/CHANGELOG.md\">CHANGELOG\u003c/a>。\u003c/p>\n\u003ch2 id=\"文档与开发\">文档与开发\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>想了解什么\u003c/th>\u003cth>从这里开始\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>日常使用与排障\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/public/guide.html\">使用指南\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/ONBOARDING.md\">新手引导\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>数据、文件与恢复\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/DATA.md\">数据说明\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/SOURCE_FILES.md\">附件说明\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>模型、搜索与外部工具\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/PROVIDERS.md\">服务配置\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/MCP.md\">MCP\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/CHATGPT_MCP.md\">ChatGPT 接入\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>代码结构与接口\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/ARCHITECTURE.md\">架构说明\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>功能边界与验收证据\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/COVERAGE.md\">需求覆盖\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/TEST_RESULTS.md\">测试记录\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>版本与维护流程\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/CHANGELOG.md\">更新记录\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/MAINTENANCE.md\">维护说明\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>主要技术栈：Node.js 24、ESM、原生 HTML/CSS/JavaScript、Markdown 与 SQLite。\u003c/p>\n\u003cp>在项目目录运行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">pnpm check\npnpm test\npnpm quality\u003c/code>\u003c/pre>\n\u003cp>完整验证入口与运行依赖审计：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">pnpm verify\npnpm audit --prod --audit-level high\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>verify\u003c/code> 依次运行仓库检查、全部测试和本地检索质量检查。日常修改按影响范围选择检查，PR 与合并遵循项目规则。Linux/macOS 的加密测试使用临时随机主密钥，不复用真实凭据。\u003c/p>\n\u003ch2 id=\"参与贡献\">参与贡献\u003c/h2>\n\u003cp>欢迎通过 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/issues\">Issue\u003c/a> 反馈问题或提出建议。描述实际现象、复现步骤和期望结果即可；示例请使用合成资料，移除个人内容与凭据。\u003c/p>\n\u003cp>提交代码前请阅读 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/CONTRIBUTING.md\">贡献指南\u003c/a> 和 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/MAINTENANCE.md\">维护说明\u003c/a>；AI Agent 还需遵循 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/AGENTS.md\">AGENTS.md\u003c/a>。\u003c/p>\n\u003col>\u003cli>获取仓库，在最新 \u003ccode>main\u003c/code> 上创建聚焦单一问题的分支。\u003c/li>\u003cli>完成修改，按影响范围验证，并补充必要的文档与更新记录。\u003c/li>\u003cli>推送分支，按项目约定提交 Pull Request；维护 Agent 遵循北京时间每日 02:00 的集中 PR 节奏。\u003c/li>\u003c/ol>\n\u003cp>发现安全问题，请按 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/SECURITY.md\">安全报告说明\u003c/a> 处理，不在公开 Issue 中粘贴敏感信息。\u003c/p>"},{"key":"B","name":"学习路线","disclosure":"全文展开","hypothesis":"先让读者看见一条资料如何变成自己的理解。","tradeoff":"学习目标更鲜明，安装命令出现在学习路线之后。","seed":"edf0771a-0678-4b9a-ba49-4313ea492d169e7dd93a-086b-446c-9489-dca6e2bace72","order":["一条资料的旅程","三种内容，各有位置","启动知序","知序能做什么","AI 与隐私","文档与开发","当前状态","参与贡献"],"markdown":"\u003c!-- README UI 原型 B，仅供比较；不替换正式 README，不加入许可证、图片或图片徽章。 -->\n\n# 知序学习工作台\n\n把收集的资料，变成自己的理解，再用到下一次学习、写作和决策中。\n\n知序是一个本地优先的中文个人学习工作台。你可以保存原文、整理知识、练习与复习，并带着来源检索和输出；AI 按需参与，资料和学习记录保存在自己的电脑上。\n\n**开发预览 v0.1.0 · 本地运行 · 中文界面与文档**\n\n\n[跟着做一遍](docs/ONBOARDING.md) · [启动知序](#启动知序) · [更新记录](CHANGELOG.md) · [CI 检查](https://github.com/wmy5555/zhixu-learning-workbench/actions/workflows/ci.yml)\n\n## 一条资料的旅程\n\n### 01 · 收集\n\n保存原文与出处。读书摘录、课程笔记、网页材料和 AI 对话先留在原始资料中，随时可以回看。\n\n### 02 · 整理\n\n按需让 AI 拆解概念、主张、方法和问题。主动联网核验时，阅读证据、分歧与适用条件，再决定哪些内容值得继续学习。\n\n### 03 · 选择\n\n只需未来查找的材料留作参考，尚未决定的内容进入候选；希望消化的知识再加入学习安排。\n\n### 04 · 理解\n\n亲自解释和作答，记录反馈与修正，再确认自己的理解。自己的回答、AI 建议和最终确认内容分别保存。\n\n### 05 · 复习与应用\n\n回到到期知识，修正误解。需要写作、推进项目或做决策时，检索材料、回看来源，再带着引用形成输出。\n\n想跟着操作，可以从今日页或帮助入口开始新手引导。引导在独立练习库中进行；教程中的 AI 请求仍使用真实服务与预算，可能产生费用。完整步骤见 [新手实操说明](docs/ONBOARDING.md)。\n\n## 三种内容，各有位置\n\n| 保存什么 | 留住什么 |\n| --- | --- |\n| 原始资料 | 实际收到的原文、出处与上下文。 |\n| 结构化材料 | 拆解得到的概念、主张、方法与问题，连同证据和限制。 |\n| 个人理解 | 你自己的解释、应用与最终确认内容。 |\n\n保存不代表学会，AI 生成也不代表你已经理解。不是每条材料都需要进入学习队列。\n\n## 启动知序\n\n需要 **Node.js 24** 和 **pnpm 11.19.0**。网页版直接运行，无需构建。\n\n### 获取并运行\n\n已下载仓库的读者可直接进入项目目录；使用 Git 获取项目时运行：\n\n```sh\ngit clone https://github.com/wmy5555/zhixu-learning-workbench.git\ncd zhixu-learning-workbench\nnpm install --global pnpm@11.19.0\npnpm install --frozen-lockfile\npnpm start\n```\n\n打开 [http://127.0.0.1:4318](http://127.0.0.1:4318)。服务默认仅监听本机回环地址。\n\n### Windows 脚本入口\n\n安装 Node.js 24 后，也可以在项目目录中依次双击：\n\n1. `install.cmd`：安装锁定依赖，首次使用或依赖更新后运行。\n2. `start.cmd`：后台启动服务并打开浏览器。\n3. `stop.cmd`：需要停止后台服务时运行。\n\n关闭浏览器不会停止后台服务；电脑关机或休眠时不保证执行复习调度。\n\n### 第一次打开\n\n先检查资料文件夹、时区和每日学习时间，再保存一小段自己的材料。没有模型密钥也可以收集、编辑、本地查找、手动整理，并保留自己的回答与笔记。\n\n需要 AI 时，在设置中配置相应服务。Linux/macOS 保存供应商凭据前需设置私有的 `LEARNING_MASTER_KEY`，详见 [.env.example](.env.example)。应用不会自动加载 `.env`；已自行配置该文件时可显式运行：\n\n```sh\nnode --env-file=.env src/server.mjs\n```\n\n## 知序能做什么\n\n适合希望把读书摘录、网页材料、课程笔记和 AI 对话持续消化，而不只是收藏起来的个人学习者。\n\n| 你想做的事 | 知序提供的帮助 |\n| --- | --- |\n| 留住原文与出处 | 粘贴文字、导入 UTF-8 文本或 Markdown，保留来源，随时回看原文。 |\n| 整理值得学习的内容 | 按需用 AI 拆解概念、主张、方法与问题；主动联网核验时保留证据、分歧和适用条件。 |\n| 练习并安排复习 | 组织学习主题，亲自作答，记录反馈与修正，按计划复习。 |\n| 形成自己的理解 | 将自己的回答、AI 建议和最终确认的理解分别保存。 |\n| 重新找到并使用知识 | 本地检索、来源回看、引用输出；可选接入向量检索与 MCP。 |\n| 管理自己的资料 | 内容以 Markdown 保存，学习与任务记录存入 SQLite，支持 Obsidian 外部编辑和备份恢复。 |\n\n原始资料、结构化材料和个人理解分别保留。保存一篇资料，不等于已经学会；AI 生成的答案也不会自动成为你已确认的个人理解。\n\n## AI 与隐私\n\n- **本地保存**：资料与学习记录保存在本机。不要把 `.data/`、`vault/`、`.env`、凭据或个人备份上传到公共仓库。\n- **按需启用**：模型、搜索、网页读取和向量能力分别配置。主动使用 AI 功能时，会向所配置的服务发送完成该操作所需的内容；联网核验还需搜索和网页读取能力。\n- **费用可查**：连接测试与模型调用可能收费。可查看用量、设置请求上限与预算；缺失用量或单价时，费用保留为未知。\n- **外部访问单独授权**：MCP 与 ChatGPT 接入默认关闭，需主动启用。允许 ChatGPT 读取知识后，内容会进入 ChatGPT 上下文，详见 [ChatGPT 连接说明](docs/CHATGPT_MCP.md)。\n\n更多说明：[文件、隐私与备份](docs/DATA.md) · [服务配置](docs/PROVIDERS.md) · [用量与费用](docs/USAGE.md)\n\n## 文档与开发\n\n| 想了解什么 | 从这里开始 |\n| --- | --- |\n| 日常使用与排障 | [使用指南](public/guide.html)、[新手引导](docs/ONBOARDING.md) |\n| 数据、文件与恢复 | [数据说明](docs/DATA.md)、[附件说明](docs/SOURCE_FILES.md) |\n| 模型、搜索与外部工具 | [服务配置](docs/PROVIDERS.md)、[MCP](docs/MCP.md)、[ChatGPT 接入](docs/CHATGPT_MCP.md) |\n| 代码结构与接口 | [架构说明](docs/ARCHITECTURE.md) |\n| 功能边界与验收证据 | [需求覆盖](docs/COVERAGE.md)、[测试记录](docs/TEST_RESULTS.md) |\n| 版本与维护流程 | [更新记录](CHANGELOG.md)、[维护说明](docs/MAINTENANCE.md) |\n\n主要技术栈：Node.js 24、ESM、原生 HTML/CSS/JavaScript、Markdown 与 SQLite。\n\n在项目目录运行：\n\n```sh\npnpm check\npnpm test\npnpm quality\n```\n\n完整验证入口与运行依赖审计：\n\n```sh\npnpm verify\npnpm audit --prod --audit-level high\n```\n\n`verify` 依次运行仓库检查、全部测试和本地检索质量检查。日常修改按影响范围选择检查，PR 与合并遵循项目规则。Linux/macOS 的加密测试使用临时随机主密钥，不复用真实凭据。\n\n## 当前状态\n\n当前为 **v0.1.0 开发预览版**，主要面向本机单用户使用。本 README 介绍本地网页版；具体功能覆盖与验收边界以 [需求覆盖](docs/COVERAGE.md) 和 [测试记录](docs/TEST_RESULTS.md) 为准。\n\n本地测试和受控模拟不能代表你的供应商已经接通。真实资料的联网核验、语义检索和教学反馈质量仍需单独验收。\n\n当前维护中文 README，不提供尚未完成的英文版链接。版本变化见 [CHANGELOG](CHANGELOG.md)。\n\n## 参与贡献\n\n欢迎通过 [Issue](https://github.com/wmy5555/zhixu-learning-workbench/issues) 反馈问题或提出建议。描述实际现象、复现步骤和期望结果即可；示例请使用合成资料，移除个人内容与凭据。\n\n提交代码前请阅读 [贡献指南](CONTRIBUTING.md) 和 [维护说明](docs/MAINTENANCE.md)；AI Agent 还需遵循 [AGENTS.md](AGENTS.md)。\n\n1. 获取仓库，在最新 `main` 上创建聚焦单一问题的分支。\n2. 完成修改，按影响范围验证，并补充必要的文档与更新记录。\n3. 推送分支，按项目约定提交 Pull Request；维护 Agent 遵循北京时间每日 02:00 的集中 PR 节奏。\n\n发现安全问题，请按 [安全报告说明](SECURITY.md) 处理，不在公开 Issue 中粘贴敏感信息。\n","html":"\u003ch1 id=\"知序学习工作台\">知序学习工作台\u003c/h1>\n\u003cp>把收集的资料，变成自己的理解，再用到下一次学习、写作和决策中。\u003c/p>\n\u003cp>知序是一个本地优先的中文个人学习工作台。你可以保存原文、整理知识、练习与复习，并带着来源检索和输出；AI 按需参与，资料和学习记录保存在自己的电脑上。\u003c/p>\n\u003cp>\u003cstrong>开发预览 v0.1.0 · 本地运行 · 中文界面与文档\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/ONBOARDING.md\">跟着做一遍\u003c/a> · \u003ca href=\"#启动知序\">启动知序\u003c/a> · \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/CHANGELOG.md\">更新记录\u003c/a> · \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/actions/workflows/ci.yml\">CI 检查\u003c/a>\u003c/p>\n\u003ch2 id=\"一条资料的旅程\">一条资料的旅程\u003c/h2>\n\u003ch3 id=\"01--收集\">01 · 收集\u003c/h3>\n\u003cp>保存原文与出处。读书摘录、课程笔记、网页材料和 AI 对话先留在原始资料中，随时可以回看。\u003c/p>\n\u003ch3 id=\"02--整理\">02 · 整理\u003c/h3>\n\u003cp>按需让 AI 拆解概念、主张、方法和问题。主动联网核验时，阅读证据、分歧与适用条件，再决定哪些内容值得继续学习。\u003c/p>\n\u003ch3 id=\"03--选择\">03 · 选择\u003c/h3>\n\u003cp>只需未来查找的材料留作参考，尚未决定的内容进入候选；希望消化的知识再加入学习安排。\u003c/p>\n\u003ch3 id=\"04--理解\">04 · 理解\u003c/h3>\n\u003cp>亲自解释和作答，记录反馈与修正，再确认自己的理解。自己的回答、AI 建议和最终确认内容分别保存。\u003c/p>\n\u003ch3 id=\"05--复习与应用\">05 · 复习与应用\u003c/h3>\n\u003cp>回到到期知识，修正误解。需要写作、推进项目或做决策时，检索材料、回看来源，再带着引用形成输出。\u003c/p>\n\u003cp>想跟着操作，可以从今日页或帮助入口开始新手引导。引导在独立练习库中进行；教程中的 AI 请求仍使用真实服务与预算，可能产生费用。完整步骤见 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/ONBOARDING.md\">新手实操说明\u003c/a>。\u003c/p>\n\u003ch2 id=\"三种内容各有位置\">三种内容，各有位置\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>保存什么\u003c/th>\u003cth>留住什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>原始资料\u003c/td>\u003ctd>实际收到的原文、出处与上下文。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>结构化材料\u003c/td>\u003ctd>拆解得到的概念、主张、方法与问题，连同证据和限制。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>个人理解\u003c/td>\u003ctd>你自己的解释、应用与最终确认内容。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>保存不代表学会，AI 生成也不代表你已经理解。不是每条材料都需要进入学习队列。\u003c/p>\n\u003ch2 id=\"启动知序\">启动知序\u003c/h2>\n\u003cp>需要 \u003cstrong>Node.js 24\u003c/strong> 和 \u003cstrong>pnpm 11.19.0\u003c/strong>。网页版直接运行，无需构建。\u003c/p>\n\u003ch3 id=\"获取并运行\">获取并运行\u003c/h3>\n\u003cp>已下载仓库的读者可直接进入项目目录；使用 Git 获取项目时运行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">git clone https://github.com/wmy5555/zhixu-learning-workbench.git\ncd zhixu-learning-workbench\nnpm install --global pnpm@11.19.0\npnpm install --frozen-lockfile\npnpm start\u003c/code>\u003c/pre>\n\u003cp>打开 \u003ca href=\"http://127.0.0.1:4318\">http://127.0.0.1:4318\u003c/a>。服务默认仅监听本机回环地址。\u003c/p>\n\u003ch3 id=\"windows-脚本入口\">Windows 脚本入口\u003c/h3>\n\u003cp>安装 Node.js 24 后，也可以在项目目录中依次双击：\u003c/p>\n\u003col>\u003cli>\u003ccode>install.cmd\u003c/code>：安装锁定依赖，首次使用或依赖更新后运行。\u003c/li>\u003cli>\u003ccode>start.cmd\u003c/code>：后台启动服务并打开浏览器。\u003c/li>\u003cli>\u003ccode>stop.cmd\u003c/code>：需要停止后台服务时运行。\u003c/li>\u003c/ol>\n\u003cp>关闭浏览器不会停止后台服务；电脑关机或休眠时不保证执行复习调度。\u003c/p>\n\u003ch3 id=\"第一次打开\">第一次打开\u003c/h3>\n\u003cp>先检查资料文件夹、时区和每日学习时间，再保存一小段自己的材料。没有模型密钥也可以收集、编辑、本地查找、手动整理，并保留自己的回答与笔记。\u003c/p>\n\u003cp>需要 AI 时，在设置中配置相应服务。Linux/macOS 保存供应商凭据前需设置私有的 \u003ccode>LEARNING_MASTER_KEY\u003c/code>，详见 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/.env.example\">.env.example\u003c/a>。应用不会自动加载 \u003ccode>.env\u003c/code>；已自行配置该文件时可显式运行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">node --env-file=.env src/server.mjs\u003c/code>\u003c/pre>\n\u003ch2 id=\"知序能做什么\">知序能做什么\u003c/h2>\n\u003cp>适合希望把读书摘录、网页材料、课程笔记和 AI 对话持续消化，而不只是收藏起来的个人学习者。\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>你想做的事\u003c/th>\u003cth>知序提供的帮助\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>留住原文与出处\u003c/td>\u003ctd>粘贴文字、导入 UTF-8 文本或 Markdown，保留来源，随时回看原文。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>整理值得学习的内容\u003c/td>\u003ctd>按需用 AI 拆解概念、主张、方法与问题；主动联网核验时保留证据、分歧和适用条件。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>练习并安排复习\u003c/td>\u003ctd>组织学习主题，亲自作答，记录反馈与修正，按计划复习。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>形成自己的理解\u003c/td>\u003ctd>将自己的回答、AI 建议和最终确认的理解分别保存。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>重新找到并使用知识\u003c/td>\u003ctd>本地检索、来源回看、引用输出；可选接入向量检索与 MCP。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>管理自己的资料\u003c/td>\u003ctd>内容以 Markdown 保存，学习与任务记录存入 SQLite，支持 Obsidian 外部编辑和备份恢复。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>原始资料、结构化材料和个人理解分别保留。保存一篇资料，不等于已经学会；AI 生成的答案也不会自动成为你已确认的个人理解。\u003c/p>\n\u003ch2 id=\"ai-与隐私\">AI 与隐私\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>本地保存\u003c/strong>：资料与学习记录保存在本机。不要把 \u003ccode>.data/\u003c/code>、\u003ccode>vault/\u003c/code>、\u003ccode>.env\u003c/code>、凭据或个人备份上传到公共仓库。\u003c/li>\u003cli>\u003cstrong>按需启用\u003c/strong>：模型、搜索、网页读取和向量能力分别配置。主动使用 AI 功能时，会向所配置的服务发送完成该操作所需的内容；联网核验还需搜索和网页读取能力。\u003c/li>\u003cli>\u003cstrong>费用可查\u003c/strong>：连接测试与模型调用可能收费。可查看用量、设置请求上限与预算；缺失用量或单价时，费用保留为未知。\u003c/li>\u003cli>\u003cstrong>外部访问单独授权\u003c/strong>：MCP 与 ChatGPT 接入默认关闭，需主动启用。允许 ChatGPT 读取知识后，内容会进入 ChatGPT 上下文，详见 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/CHATGPT_MCP.md\">ChatGPT 连接说明\u003c/a>。\u003c/li>\u003c/ul>\n\u003cp>更多说明：\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/DATA.md\">文件、隐私与备份\u003c/a> · \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/PROVIDERS.md\">服务配置\u003c/a> · \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/USAGE.md\">用量与费用\u003c/a>\u003c/p>\n\u003ch2 id=\"文档与开发\">文档与开发\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>想了解什么\u003c/th>\u003cth>从这里开始\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>日常使用与排障\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/public/guide.html\">使用指南\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/ONBOARDING.md\">新手引导\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>数据、文件与恢复\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/DATA.md\">数据说明\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/SOURCE_FILES.md\">附件说明\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>模型、搜索与外部工具\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/PROVIDERS.md\">服务配置\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/MCP.md\">MCP\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/CHATGPT_MCP.md\">ChatGPT 接入\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>代码结构与接口\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/ARCHITECTURE.md\">架构说明\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>功能边界与验收证据\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/COVERAGE.md\">需求覆盖\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/TEST_RESULTS.md\">测试记录\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>版本与维护流程\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/CHANGELOG.md\">更新记录\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/MAINTENANCE.md\">维护说明\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>主要技术栈：Node.js 24、ESM、原生 HTML/CSS/JavaScript、Markdown 与 SQLite。\u003c/p>\n\u003cp>在项目目录运行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">pnpm check\npnpm test\npnpm quality\u003c/code>\u003c/pre>\n\u003cp>完整验证入口与运行依赖审计：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">pnpm verify\npnpm audit --prod --audit-level high\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>verify\u003c/code> 依次运行仓库检查、全部测试和本地检索质量检查。日常修改按影响范围选择检查，PR 与合并遵循项目规则。Linux/macOS 的加密测试使用临时随机主密钥，不复用真实凭据。\u003c/p>\n\u003ch2 id=\"当前状态\">当前状态\u003c/h2>\n\u003cp>当前为 \u003cstrong>v0.1.0 开发预览版\u003c/strong>，主要面向本机单用户使用。本 README 介绍本地网页版；具体功能覆盖与验收边界以 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/COVERAGE.md\">需求覆盖\u003c/a> 和 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/TEST_RESULTS.md\">测试记录\u003c/a> 为准。\u003c/p>\n\u003cp>本地测试和受控模拟不能代表你的供应商已经接通。真实资料的联网核验、语义检索和教学反馈质量仍需单独验收。\u003c/p>\n\u003cp>当前维护中文 README，不提供尚未完成的英文版链接。版本变化见 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/CHANGELOG.md\">CHANGELOG\u003c/a>。\u003c/p>\n\u003ch2 id=\"参与贡献\">参与贡献\u003c/h2>\n\u003cp>欢迎通过 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/issues\">Issue\u003c/a> 反馈问题或提出建议。描述实际现象、复现步骤和期望结果即可；示例请使用合成资料，移除个人内容与凭据。\u003c/p>\n\u003cp>提交代码前请阅读 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/CONTRIBUTING.md\">贡献指南\u003c/a> 和 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/MAINTENANCE.md\">维护说明\u003c/a>；AI Agent 还需遵循 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/AGENTS.md\">AGENTS.md\u003c/a>。\u003c/p>\n\u003col>\u003cli>获取仓库，在最新 \u003ccode>main\u003c/code> 上创建聚焦单一问题的分支。\u003c/li>\u003cli>完成修改，按影响范围验证，并补充必要的文档与更新记录。\u003c/li>\u003cli>推送分支，按项目约定提交 Pull Request；维护 Agent 遵循北京时间每日 02:00 的集中 PR 节奏。\u003c/li>\u003c/ol>\n\u003cp>发现安全问题，请按 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/SECURITY.md\">安全报告说明\u003c/a> 处理，不在公开 Issue 中粘贴敏感信息。\u003c/p>"},{"key":"C","name":"任务索引","disclosure":"技术细节折叠","hypothesis":"让读者按眼前要做的事进入文档，减少通读成本。","tradeoff":"查找与回访更快，首次了解学习理念的叙事较少。","seed":"5c11d909-976a-4089-9d15-13c47a9e36edf2a1dbcd-c4bd-4039-958e-e5e943b7ecb6","order":["按目的找到入口","目录","功能一览","安装与运行","学习流程","AI 与隐私","当前状态","开发与贡献"],"markdown":"\u003c!-- README UI 原型 C，仅供比较；不替换正式 README，不加入许可证、图片或图片徽章。 -->\n\n# 知序学习工作台\n\n把收集的资料，变成自己的理解，再用到下一次学习、写作和决策中。\n\n知序是一个本地优先的中文个人学习工作台。你可以保存原文、整理知识、练习与复习，并带着来源检索和输出；AI 按需参与，资料和学习记录保存在自己的电脑上。\n\n**开发预览 v0.1.0 · 本地运行 · 中文界面与文档**\n\n\n## 按目的找到入口\n\n| 现在想做什么 | 直接进入 |\n| --- | --- |\n| 第一次运行知序 | [安装与运行](#安装与运行) |\n| 跟着材料体验学习 | [新手引导](docs/ONBOARDING.md) |\n| 查找某个操作 | [使用指南](public/guide.html) |\n| 设置模型、搜索或向量 | [服务配置](docs/PROVIDERS.md) |\n| 理解保存、外发与费用 | [AI 与隐私](#ai-与隐私) |\n| 查看近期变化与项目检查 | [更新记录](CHANGELOG.md) · [CI 检查](https://github.com/wmy5555/zhixu-learning-workbench/actions/workflows/ci.yml) |\n\n## 目录\n\n- [功能一览](#功能一览)\n- [安装与运行](#安装与运行)\n- [学习流程](#学习流程)\n- [AI 与隐私](#ai-与隐私)\n- [当前状态](#当前状态)\n- [开发与贡献](#开发与贡献)\n\n## 功能一览\n\n适合希望把读书摘录、网页材料、课程笔记和 AI 对话持续消化，而不只是收藏起来的个人学习者。\n\n| 你想做的事 | 知序提供的帮助 |\n| --- | --- |\n| 留住原文与出处 | 粘贴文字、导入 UTF-8 文本或 Markdown，保留来源，随时回看原文。 |\n| 整理值得学习的内容 | 按需用 AI 拆解概念、主张、方法与问题；主动联网核验时保留证据、分歧和适用条件。 |\n| 练习并安排复习 | 组织学习主题，亲自作答，记录反馈与修正，按计划复习。 |\n| 形成自己的理解 | 将自己的回答、AI 建议和最终确认的理解分别保存。 |\n| 重新找到并使用知识 | 本地检索、来源回看、引用输出；可选接入向量检索与 MCP。 |\n| 管理自己的资料 | 内容以 Markdown 保存，学习与任务记录存入 SQLite，支持 Obsidian 外部编辑和备份恢复。 |\n\n原始资料、结构化材料和个人理解分别保留。保存一篇资料，不等于已经学会；AI 生成的答案也不会自动成为你已确认的个人理解。\n\n## 安装与运行\n\n需要 **Node.js 24** 和 **pnpm 11.19.0**。网页版直接运行，无需构建。\n\n\u003cdetails>\n\u003csummary>获取并运行\u003c/summary>\n\n已下载仓库的读者可直接进入项目目录；使用 Git 获取项目时运行：\n\n```sh\ngit clone https://github.com/wmy5555/zhixu-learning-workbench.git\ncd zhixu-learning-workbench\nnpm install --global pnpm@11.19.0\npnpm install --frozen-lockfile\npnpm start\n```\n\n打开 [http://127.0.0.1:4318](http://127.0.0.1:4318)。服务默认仅监听本机回环地址。\n\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>Windows 脚本入口\u003c/summary>\n\n安装 Node.js 24 后，也可以在项目目录中依次双击：\n\n1. `install.cmd`：安装锁定依赖，首次使用或依赖更新后运行。\n2. `start.cmd`：后台启动服务并打开浏览器。\n3. `stop.cmd`：需要停止后台服务时运行。\n\n关闭浏览器不会停止后台服务；电脑关机或休眠时不保证执行复习调度。\n\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>第一次打开\u003c/summary>\n\n先检查资料文件夹、时区和每日学习时间，再保存一小段自己的材料。没有模型密钥也可以收集、编辑、本地查找、手动整理，并保留自己的回答与笔记。\n\n需要 AI 时，在设置中配置相应服务。Linux/macOS 保存供应商凭据前需设置私有的 `LEARNING_MASTER_KEY`，详见 [.env.example](.env.example)。应用不会自动加载 `.env`；已自行配置该文件时可显式运行：\n\n```sh\nnode --env-file=.env src/server.mjs\n```\n\n\u003c/details>\n\n## 学习流程\n\n1. **收集**：保存一段原文，并补充出处。\n2. **整理**：按需运行 AI 拆解，阅读结果；需要核验时，主动检索并查看证据和限制。\n3. **选择**：决定留作参考、暂存候选，还是加入学习安排。\n4. **学习**：自己解释或作答，阅读反馈，再确认自己的理解。\n5. **复习与应用**：回到到期知识，修正误解；检索材料并带着引用形成输出。\n\n想跟着操作，可以从今日页或帮助入口开始新手引导。引导在独立练习库中进行；教程中的 AI 请求仍使用真实服务与预算，可能产生费用。完整步骤见 [新手实操说明](docs/ONBOARDING.md)。\n\n## AI 与隐私\n\n- **本地保存**：资料与学习记录保存在本机。不要把 `.data/`、`vault/`、`.env`、凭据或个人备份上传到公共仓库。\n- **按需启用**：模型、搜索、网页读取和向量能力分别配置。主动使用 AI 功能时，会向所配置的服务发送完成该操作所需的内容；联网核验还需搜索和网页读取能力。\n- **费用可查**：连接测试与模型调用可能收费。可查看用量、设置请求上限与预算；缺失用量或单价时，费用保留为未知。\n- **外部访问单独授权**：MCP 与 ChatGPT 接入默认关闭，需主动启用。允许 ChatGPT 读取知识后，内容会进入 ChatGPT 上下文，详见 [ChatGPT 连接说明](docs/CHATGPT_MCP.md)。\n\n更多说明：[文件、隐私与备份](docs/DATA.md) · [服务配置](docs/PROVIDERS.md) · [用量与费用](docs/USAGE.md)\n\n## 当前状态\n\n当前为 **v0.1.0 开发预览版**，主要面向本机单用户使用。本 README 介绍本地网页版；具体功能覆盖与验收边界以 [需求覆盖](docs/COVERAGE.md) 和 [测试记录](docs/TEST_RESULTS.md) 为准。\n\n本地测试和受控模拟不能代表你的供应商已经接通。真实资料的联网核验、语义检索和教学反馈质量仍需单独验收。\n\n当前维护中文 README，不提供尚未完成的英文版链接。版本变化见 [CHANGELOG](CHANGELOG.md)。\n\n## 开发与贡献\n\n| 想了解什么 | 从这里开始 |\n| --- | --- |\n| 日常使用与排障 | [使用指南](public/guide.html)、[新手引导](docs/ONBOARDING.md) |\n| 数据、文件与恢复 | [数据说明](docs/DATA.md)、[附件说明](docs/SOURCE_FILES.md) |\n| 模型、搜索与外部工具 | [服务配置](docs/PROVIDERS.md)、[MCP](docs/MCP.md)、[ChatGPT 接入](docs/CHATGPT_MCP.md) |\n| 代码结构与接口 | [架构说明](docs/ARCHITECTURE.md) |\n| 功能边界与验收证据 | [需求覆盖](docs/COVERAGE.md)、[测试记录](docs/TEST_RESULTS.md) |\n| 版本与维护流程 | [更新记录](CHANGELOG.md)、[维护说明](docs/MAINTENANCE.md) |\n\n\u003cdetails>\n\u003csummary>技术栈与验证命令\u003c/summary>\n\n主要技术栈：Node.js 24、ESM、原生 HTML/CSS/JavaScript、Markdown 与 SQLite。\n\n在项目目录运行：\n\n```sh\npnpm check\npnpm test\npnpm quality\n```\n\n完整验证入口与运行依赖审计：\n\n```sh\npnpm verify\npnpm audit --prod --audit-level high\n```\n\n`verify` 依次运行仓库检查、全部测试和本地检索质量检查。日常修改按影响范围选择检查，PR 与合并遵循项目规则。Linux/macOS 的加密测试使用临时随机主密钥，不复用真实凭据。\n\n\u003c/details>\n\n欢迎通过 [Issue](https://github.com/wmy5555/zhixu-learning-workbench/issues) 反馈问题或提出建议。描述实际现象、复现步骤和期望结果即可；示例请使用合成资料，移除个人内容与凭据。\n\n提交代码前请阅读 [贡献指南](CONTRIBUTING.md) 和 [维护说明](docs/MAINTENANCE.md)；AI Agent 还需遵循 [AGENTS.md](AGENTS.md)。\n\n1. 获取仓库，在最新 `main` 上创建聚焦单一问题的分支。\n2. 完成修改，按影响范围验证，并补充必要的文档与更新记录。\n3. 推送分支，按项目约定提交 Pull Request；维护 Agent 遵循北京时间每日 02:00 的集中 PR 节奏。\n\n发现安全问题，请按 [安全报告说明](SECURITY.md) 处理，不在公开 Issue 中粘贴敏感信息。\n","html":"\u003ch1 id=\"知序学习工作台\">知序学习工作台\u003c/h1>\n\u003cp>把收集的资料，变成自己的理解，再用到下一次学习、写作和决策中。\u003c/p>\n\u003cp>知序是一个本地优先的中文个人学习工作台。你可以保存原文、整理知识、练习与复习，并带着来源检索和输出；AI 按需参与，资料和学习记录保存在自己的电脑上。\u003c/p>\n\u003cp>\u003cstrong>开发预览 v0.1.0 · 本地运行 · 中文界面与文档\u003c/strong>\u003c/p>\n\u003ch2 id=\"按目的找到入口\">按目的找到入口\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>现在想做什么\u003c/th>\u003cth>直接进入\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>第一次运行知序\u003c/td>\u003ctd>\u003ca href=\"#安装与运行\">安装与运行\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>跟着材料体验学习\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/ONBOARDING.md\">新手引导\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>查找某个操作\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/public/guide.html\">使用指南\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>设置模型、搜索或向量\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/PROVIDERS.md\">服务配置\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>理解保存、外发与费用\u003c/td>\u003ctd>\u003ca href=\"#ai-与隐私\">AI 与隐私\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>查看近期变化与项目检查\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/CHANGELOG.md\">更新记录\u003c/a> · \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/actions/workflows/ci.yml\">CI 检查\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"目录\">目录\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"#功能一览\">功能一览\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#安装与运行\">安装与运行\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#学习流程\">学习流程\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#ai-与隐私\">AI 与隐私\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#当前状态\">当前状态\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#开发与贡献\">开发与贡献\u003c/a>\u003c/li>\u003c/ul>\n\u003ch2 id=\"功能一览\">功能一览\u003c/h2>\n\u003cp>适合希望把读书摘录、网页材料、课程笔记和 AI 对话持续消化，而不只是收藏起来的个人学习者。\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>你想做的事\u003c/th>\u003cth>知序提供的帮助\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>留住原文与出处\u003c/td>\u003ctd>粘贴文字、导入 UTF-8 文本或 Markdown，保留来源，随时回看原文。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>整理值得学习的内容\u003c/td>\u003ctd>按需用 AI 拆解概念、主张、方法与问题；主动联网核验时保留证据、分歧和适用条件。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>练习并安排复习\u003c/td>\u003ctd>组织学习主题，亲自作答，记录反馈与修正，按计划复习。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>形成自己的理解\u003c/td>\u003ctd>将自己的回答、AI 建议和最终确认的理解分别保存。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>重新找到并使用知识\u003c/td>\u003ctd>本地检索、来源回看、引用输出；可选接入向量检索与 MCP。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>管理自己的资料\u003c/td>\u003ctd>内容以 Markdown 保存，学习与任务记录存入 SQLite，支持 Obsidian 外部编辑和备份恢复。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>原始资料、结构化材料和个人理解分别保留。保存一篇资料，不等于已经学会；AI 生成的答案也不会自动成为你已确认的个人理解。\u003c/p>\n\u003ch2 id=\"安装与运行\">安装与运行\u003c/h2>\n\u003cp>需要 \u003cstrong>Node.js 24\u003c/strong> 和 \u003cstrong>pnpm 11.19.0\u003c/strong>。网页版直接运行，无需构建。\u003c/p>\n\u003cdetails>\n\u003csummary>获取并运行\u003c/summary>\n\u003cp>已下载仓库的读者可直接进入项目目录；使用 Git 获取项目时运行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">git clone https://github.com/wmy5555/zhixu-learning-workbench.git\ncd zhixu-learning-workbench\nnpm install --global pnpm@11.19.0\npnpm install --frozen-lockfile\npnpm start\u003c/code>\u003c/pre>\n\u003cp>打开 \u003ca href=\"http://127.0.0.1:4318\">http://127.0.0.1:4318\u003c/a>。服务默认仅监听本机回环地址。\u003c/p>\n\u003c/details>\n\u003cdetails>\n\u003csummary>Windows 脚本入口\u003c/summary>\n\u003cp>安装 Node.js 24 后，也可以在项目目录中依次双击：\u003c/p>\n\u003col>\u003cli>\u003ccode>install.cmd\u003c/code>：安装锁定依赖，首次使用或依赖更新后运行。\u003c/li>\u003cli>\u003ccode>start.cmd\u003c/code>：后台启动服务并打开浏览器。\u003c/li>\u003cli>\u003ccode>stop.cmd\u003c/code>：需要停止后台服务时运行。\u003c/li>\u003c/ol>\n\u003cp>关闭浏览器不会停止后台服务；电脑关机或休眠时不保证执行复习调度。\u003c/p>\n\u003c/details>\n\u003cdetails>\n\u003csummary>第一次打开\u003c/summary>\n\u003cp>先检查资料文件夹、时区和每日学习时间，再保存一小段自己的材料。没有模型密钥也可以收集、编辑、本地查找、手动整理，并保留自己的回答与笔记。\u003c/p>\n\u003cp>需要 AI 时，在设置中配置相应服务。Linux/macOS 保存供应商凭据前需设置私有的 \u003ccode>LEARNING_MASTER_KEY\u003c/code>，详见 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/.env.example\">.env.example\u003c/a>。应用不会自动加载 \u003ccode>.env\u003c/code>；已自行配置该文件时可显式运行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">node --env-file=.env src/server.mjs\u003c/code>\u003c/pre>\n\u003c/details>\n\u003ch2 id=\"学习流程\">学习流程\u003c/h2>\n\u003col>\u003cli>\u003cstrong>收集\u003c/strong>：保存一段原文，并补充出处。\u003c/li>\u003cli>\u003cstrong>整理\u003c/strong>：按需运行 AI 拆解，阅读结果；需要核验时，主动检索并查看证据和限制。\u003c/li>\u003cli>\u003cstrong>选择\u003c/strong>：决定留作参考、暂存候选，还是加入学习安排。\u003c/li>\u003cli>\u003cstrong>学习\u003c/strong>：自己解释或作答，阅读反馈，再确认自己的理解。\u003c/li>\u003cli>\u003cstrong>复习与应用\u003c/strong>：回到到期知识，修正误解；检索材料并带着引用形成输出。\u003c/li>\u003c/ol>\n\u003cp>想跟着操作，可以从今日页或帮助入口开始新手引导。引导在独立练习库中进行；教程中的 AI 请求仍使用真实服务与预算，可能产生费用。完整步骤见 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/ONBOARDING.md\">新手实操说明\u003c/a>。\u003c/p>\n\u003ch2 id=\"ai-与隐私\">AI 与隐私\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>本地保存\u003c/strong>：资料与学习记录保存在本机。不要把 \u003ccode>.data/\u003c/code>、\u003ccode>vault/\u003c/code>、\u003ccode>.env\u003c/code>、凭据或个人备份上传到公共仓库。\u003c/li>\u003cli>\u003cstrong>按需启用\u003c/strong>：模型、搜索、网页读取和向量能力分别配置。主动使用 AI 功能时，会向所配置的服务发送完成该操作所需的内容；联网核验还需搜索和网页读取能力。\u003c/li>\u003cli>\u003cstrong>费用可查\u003c/strong>：连接测试与模型调用可能收费。可查看用量、设置请求上限与预算；缺失用量或单价时，费用保留为未知。\u003c/li>\u003cli>\u003cstrong>外部访问单独授权\u003c/strong>：MCP 与 ChatGPT 接入默认关闭，需主动启用。允许 ChatGPT 读取知识后，内容会进入 ChatGPT 上下文，详见 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/CHATGPT_MCP.md\">ChatGPT 连接说明\u003c/a>。\u003c/li>\u003c/ul>\n\u003cp>更多说明：\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/DATA.md\">文件、隐私与备份\u003c/a> · \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/PROVIDERS.md\">服务配置\u003c/a> · \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/USAGE.md\">用量与费用\u003c/a>\u003c/p>\n\u003ch2 id=\"当前状态\">当前状态\u003c/h2>\n\u003cp>当前为 \u003cstrong>v0.1.0 开发预览版\u003c/strong>，主要面向本机单用户使用。本 README 介绍本地网页版；具体功能覆盖与验收边界以 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/COVERAGE.md\">需求覆盖\u003c/a> 和 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/TEST_RESULTS.md\">测试记录\u003c/a> 为准。\u003c/p>\n\u003cp>本地测试和受控模拟不能代表你的供应商已经接通。真实资料的联网核验、语义检索和教学反馈质量仍需单独验收。\u003c/p>\n\u003cp>当前维护中文 README，不提供尚未完成的英文版链接。版本变化见 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/CHANGELOG.md\">CHANGELOG\u003c/a>。\u003c/p>\n\u003ch2 id=\"开发与贡献\">开发与贡献\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>想了解什么\u003c/th>\u003cth>从这里开始\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>日常使用与排障\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/public/guide.html\">使用指南\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/ONBOARDING.md\">新手引导\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>数据、文件与恢复\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/DATA.md\">数据说明\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/SOURCE_FILES.md\">附件说明\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>模型、搜索与外部工具\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/PROVIDERS.md\">服务配置\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/MCP.md\">MCP\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/CHATGPT_MCP.md\">ChatGPT 接入\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>代码结构与接口\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/ARCHITECTURE.md\">架构说明\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>功能边界与验收证据\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/COVERAGE.md\">需求覆盖\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/TEST_RESULTS.md\">测试记录\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>版本与维护流程\u003c/td>\u003ctd>\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/CHANGELOG.md\">更新记录\u003c/a>、\u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/MAINTENANCE.md\">维护说明\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails>\n\u003csummary>技术栈与验证命令\u003c/summary>\n\u003cp>主要技术栈：Node.js 24、ESM、原生 HTML/CSS/JavaScript、Markdown 与 SQLite。\u003c/p>\n\u003cp>在项目目录运行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">pnpm check\npnpm test\npnpm quality\u003c/code>\u003c/pre>\n\u003cp>完整验证入口与运行依赖审计：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">pnpm verify\npnpm audit --prod --audit-level high\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>verify\u003c/code> 依次运行仓库检查、全部测试和本地检索质量检查。日常修改按影响范围选择检查，PR 与合并遵循项目规则。Linux/macOS 的加密测试使用临时随机主密钥，不复用真实凭据。\u003c/p>\n\u003c/details>\n\u003cp>欢迎通过 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/issues\">Issue\u003c/a> 反馈问题或提出建议。描述实际现象、复现步骤和期望结果即可；示例请使用合成资料，移除个人内容与凭据。\u003c/p>\n\u003cp>提交代码前请阅读 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/CONTRIBUTING.md\">贡献指南\u003c/a> 和 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/docs/MAINTENANCE.md\">维护说明\u003c/a>；AI Agent 还需遵循 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/AGENTS.md\">AGENTS.md\u003c/a>。\u003c/p>\n\u003col>\u003cli>获取仓库，在最新 \u003ccode>main\u003c/code> 上创建聚焦单一问题的分支。\u003c/li>\u003cli>完成修改，按影响范围验证，并补充必要的文档与更新记录。\u003c/li>\u003cli>推送分支，按项目约定提交 Pull Request；维护 Agent 遵循北京时间每日 02:00 的集中 PR 节奏。\u003c/li>\u003c/ol>\n\u003cp>发现安全问题，请按 \u003ca href=\"https://github.com/wmy5555/zhixu-learning-workbench/blob/feat/prototype-readme-20261024/SECURITY.md\">安全报告说明\u003c/a> 处理，不在公开 Issue 中粘贴敏感信息。\u003c/p>"}]</script>
<script>
const variants=JSON.parse(document.getElementById('prototype-data').textContent);
const readme=document.getElementById('readme'),current=document.getElementById('current'),dialog=document.getElementById('source-dialog');
let index=0,downloadURL;
function show(key,updateURL=true){
 index=Math.max(0,variants.findIndex(v=>v.key===key));const variant=variants[index];
 readme.className='readme variant-'+variant.key;readme.innerHTML=variant.html;
 current.replaceChildren(document.createTextNode(variant.key+' · '+variant.name));
 const count=document.createElement('small');count.textContent=(index+1)+' / '+variants.length;current.append(count);
 current.title=variant.disclosure+'；'+variant.hypothesis+' '+variant.tradeoff;
 document.title='知序 README · '+variant.key+' '+variant.name;
 if(updateURL){const url=new URL(location.href);url.searchParams.set('variant',variant.key);url.hash='';history.replaceState(null,'',url);window.scrollTo(0,0);}
 console.info('README prototype',{variant:variant.key,name:variant.name,disclosure:variant.disclosure,sections:variant.order,license:false,images:false,persistence:false});
}
function cycle(delta){show(variants[(index+delta+variants.length)%variants.length].key);}
if(!false){
 document.getElementById('previous').addEventListener('click',()=>cycle(-1));document.getElementById('next').addEventListener('click',()=>cycle(1));
 document.addEventListener('keydown',event=>{if(dialog.open||event.altKey||event.ctrlKey||event.metaKey||event.target.closest('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycle(event.key==='ArrowLeft'?-1:1);}});
}
document.getElementById('source-button').addEventListener('click',()=>{
 const variant=variants[index];document.getElementById('source-title').textContent=variant.key+' · '+variant.name;
 document.getElementById('source-text').textContent=variant.markdown;
 if(downloadURL)URL.revokeObjectURL(downloadURL);downloadURL=URL.createObjectURL(new Blob([variant.markdown],{type:'text/markdown;charset=utf-8'}));
 const download=document.getElementById('download');download.href=downloadURL;download.download='README.PROTOTYPE-'+variant.key+'.md';dialog.showModal();
});
document.getElementById('close-source').addEventListener('click',()=>dialog.close());
window.addEventListener('popstate',()=>show(new URL(location.href).searchParams.get('variant')||'A',false));
show(new URL(location.href).searchParams.get('variant')||'A',false);
</script></body></html>
