plugins { id 'com.android.application' }
android {
    namespace 'io.github.wmy5555.zhixu.test'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.wmy5555.zhixu.test'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-personal-test'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { applicationIdSuffix '' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
// No third-party runtime dependencies, Google Play Services or network permission.
// Release is unsigned; the approved task-specific keystore is supplied to apksigner externally.
