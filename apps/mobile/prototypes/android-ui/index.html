<body>
<main class="studio">
  <aside class="studio-aside">
    <div class="brand"><span data-icon="leaf"></span>知序 <span class="eyebrow" style="font:9px var(--sans);margin-left:7px">ANDROID / DESIGN STUDY</span></div>
    <h1>把书桌，<br>带在身边。</h1>
    <p>沿用网页版的温度与秩序，<br>为一只手、一段专注的时间重新排版。</p>
    <div class="direction"><div class="eyebrow" id="direction-key"></div><h2 id="direction-name"></h2><p id="direction-detail"></p></div>
    <div class="swatches"><span style="background:#1a1a18"></span><span style="background:#2b2b27"></span><span style="background:#f6f5f0"></span><span style="background:#c6613f"></span></div>
    <p class="prototype-note">网页模拟 · 示例资料仅在内存<br>这不是 Android 安装包，也不会连接真实服务。</p>
  </aside>
  <section class="device" aria-label="Android 手机界面原型">
    <div class="mobile-controls"><button data-act="theme">深 / 浅</button><button data-act="scene">示例 / 空白</button></div>
    <div class="phone">
      <div class="statusbar" aria-label="模拟系统状态栏"><span>9:41</span><div class="row"><span data-icon="signal"></span><span data-icon="wifi"></span><span data-icon="battery"></span></div></div>
      <header class="phone-header" id="phone-header"></header>
      <div class="screen" id="screen"></div>
      <nav class="tabbar" id="tabbar" aria-label="主导航"></nav>
      <div class="home-line"></div>
      <div class="sheet-backdrop" id="sheet-backdrop" hidden><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></section></div>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
  </section>
  <aside class="inspector">
    <div class="eyebrow">预览环境</div>
    <label>外观</label><div class="seg" id="theme-switch"><button data-theme="dark">深色</button><button data-theme="light">浅色</button></div>
    <label>资料状态</label><div class="seg" id="scene-switch"><button data-scene="sample">示例资料</button><button data-scene="empty">空白库</button></div>
    <div class="state-readout" id="state-readout" aria-live="polite"></div>
    <p class="prototype-note">可操作：收集 → 保存 → 阅读<br>学习、检索、主题与底部导航<br>切换方案也会保留本页草稿。</p>
  </aside>
</main>
<div class="switcher" aria-label="设计方案切换"><button id="previous-variant" aria-label="上一个设计方案"><span data-icon="left"></span></button><span class="variant-label" id="variant-label" aria-live="polite"></span><button id="next-variant" aria-label="下一个设计方案"><span data-icon="right"></span></button></div>
<script>
if(document.documentElement.dataset.prototype==='true'){
const paths={leaf:'M4 20C4 10 10 4 21 3C21 14 16 21 4 20ZM4 20L15 9M10 14V8M10 14H16',sun:'M12 3V1M12 23V21M3 12H1M23 12H21M4 4L5.5 5.5M18.5 18.5L20 20M4 20L5.5 18.5M18.5 5.5L20 4M17 12A5 5 0 1 1 7 12A5 5 0 1 1 17 12',plus:'M12 5V19M5 12H19',book:'M3 4H9Q12 4 12 7V21Q10 18 3 19ZM21 4H15Q12 4 12 7V21Q14 18 21 19Z',learn:'M12 3L22 8L12 13L2 8ZM6 10V17Q12 21 18 17V10M22 8V16',pen:'M4 20L5 15L17 3L21 7L9 19ZM14 6L18 10',search:'M16 10A6 6 0 1 1 4 10A6 6 0 1 1 16 10M15 15L21 21',right:'M9 5L16 12L9 19',left:'M15 5L8 12L15 19',arrow:'M4 12H20M14 6L20 12L14 18',up:'M6 18L18 6M6 6H18V18',down:'M6 9L12 15L18 9',close:'M5 5L19 19M19 5L5 19',settings:'M4 6H20M4 12H20M4 18H20M8 3V9M16 9V15M10 15V21',clock:'M21 12A9 9 0 1 1 3 12A9 9 0 1 1 21 12M12 6V12L16 14',spark:'M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5Z',layers:'M12 3L22 8L12 13L2 8ZM3 12L12 17L21 12M3 16L12 21L21 16',attach:'M8 14L15 7Q18 4 20 7Q21 9 19 11L10 20Q6 24 3 20Q0 17 4 13L14 3',check:'M4 12L9 17L20 6',file:'M5 3H14L20 9V21H5ZM14 3V9H20M9 13H16M9 17H16',bookmark:'M6 3H18V22L12 17L6 22Z',refresh:'M20 8A9 9 0 1 0 21 15M20 3V8H15',signal:'M4 18V16M9 18V12M14 18V8M19 18V4',wifi:'M3 8Q12 0 21 8M6 12Q12 6 18 12M9 16Q12 13 15 16M12 20H12.1',battery:'M2 6H19V18H2ZM22 10V14M5 9H15V15H5Z',more:'M5 12H5.1M12 12H12.1M19 12H19.1',moon:'M20 14A9 9 0 0 1 10 3A9 9 0 1 0 20 14',quote:'M3 12H9V20H3V12Q3 6 9 4M14 12H20V20H14V12Q14 6 20 4'};
const icon=(name,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.file}"/></svg>`;
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const variants={A:{name:'静读书桌',detail:'延续网页版的阅读气质。一张主卡片承接当下，学习安排与资料顺着页面展开。',key:'01 / EDITORIAL DESK'},B:{name:'一页手记',detail:'以文字与细线组织信息。先留下一点想法，再从自己的手记中继续学习。',key:'02 / PERSONAL JOURNAL'},C:{name:'专注一刻',detail:'一次只突出一件事。当前学习占据视觉中心，其他入口退到下一层。',key:'03 / FOCUS FIRST'}};
const seed=[{id:1,kind:'知识',title:'为什么读懂，不等于记住？',body:'读完一段文字时，我们常常觉得自己已经理解。\n\n把书合上，用自己的话再讲一次，才会发现哪些地方仍然模糊。\n\n学习手记\n给概念找一个生活中的例子。下一次回来时，先尝试解释，再打开原文核对。',excerpt:'把书合上，说一次自己的理解。',topic:'学习如何学习',when:'昨天',minutes:6},{id:2,kind:'原始资料',title:'在记录之前，先留下一个问题',body:'今天想记录的，不只是这段话本身。\n\n它为什么让我停下来？我希望在什么地方重新用到它？\n\n给摘录留一点自己的语境。以后翻回这里，才知道当初为什么收藏。',excerpt:'让每一份摘录，都带着一点自己的语境。',topic:'阅读手记',when:'10 月 21 日',minutes:8},{id:3,kind:'知识',title:'把一个概念，放进真实生活里',body:'试着为一个新概念写下两个不同的例子。\n\n一个来自熟悉的生活，一个来自刚接触的领域。\n\n这是一份用于界面原型的示例手记。',excerpt:'从一个熟悉的例子，走到一个新的情境。',topic:'理解与迁移',when:'10 月 20 日',minutes:6}];
const params=new URLSearchParams(location.protocol==='file:'?location.hash.slice(1):location.search);
const state={variant:variants[params.get('variant')]?params.get('variant'):'A',theme:params.get('theme')==='light'?'light':'dark',scene:params.get('scene')==='empty'?'empty':'sample',page:'today',previous:'library',notes:[],selected:1,filter:'全部',query:'',draft:{title:'',body:'',source:'',ai:false,research:false},goal:'',mode:'回答',answer:'',submitted:false,output:false,completed:false,sourceOpen:false};
state.notes=state.scene==='sample'?structuredClone(seed):[];
const screen=document.querySelector('#screen'),phone=document.querySelector('.phone');
const names={today:'今日',capture:'收集',library:'知识库',study:'学习',output:'应用',reader:'阅读',session:'练习'};
const btn=(label,act,extra='',cls='primary')=>`<button class="${cls}" data-act="${act}" ${extra}>${label}</button>`;
const row=(label,detail,ic,action)=>`<button class="link-row" data-act="${action}">${icon(ic)}<span class="grow"><strong>${label}</strong>${detail?`<small>${detail}</small>`:''}</span>${icon('right','chev')}</button>`;
const blank=(title,copy,action='capture',label='收集第一份资料')=>`<div class="blank">${icon('leaf')}<h2>${title}</h2><p>${copy}</p>${btn(label,action)}</div>`;
const title=(heading,copy='',eyebrow='')=>`<div class="page-top">${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}<h1 class="page-title">${heading}</h1>${copy?`<p class="page-intro">${copy}</p>`:''}</div>`;
const section=(heading,action='',label='查看全部')=>`<div class="section-head"><h2>${heading}</h2>${action?btn(`${label} ${icon('up')}`,action,'','text-btn'):''}</div>`;
const botanical=()=>`<svg class="botanical" viewBox="0 0 140 190" aria-hidden="true"><path d="M49 187Q58 109 114 25M65 126Q12 121 17 65Q65 81 65 126M81 96Q132 93 136 48Q94 55 81 96M97 60Q60 28 86 5Q111 26 97 60M56 156Q97 160 120 116Q79 113 56 156"/></svg>`;
const agenda=()=>state.notes.slice(0,2).map((n,i)=>`<button class="agenda-row" data-act="read" data-id="${n.id}"><span class="ordinal">0${i+1}</span><span class="grow"><strong>${esc(n.title)}</strong><p>${i===0?'再次理解':'换一个角度'} · ${n.minutes} 分钟</p></span>${icon('right')}</button>`).join('');
const budget=()=>{const planned=state.notes.slice(0,2).reduce((sum,n)=>sum+n.minutes,0);return `<div class="budget"><span>今天可用 <b>25</b> 分钟</span><span class="ticks">${Array.from({length:8},(_,i)=>`<i class="${i<Math.round(planned/25*8)?'used':''}"></i>`).join('')}</span><span>留白 ${Math.max(0,25-planned)} 分钟</span></div>`;};
function VariantA(){return `<div class="desk-greeting"><div><div class="eyebrow">A LITTLE LEARNING, EVERY DAY</div><h1>把今天的理解，<br>再往前推一点。</h1></div><div class="tiny-date"><strong>23</strong><span>十月 · 周五</span></div></div><div class="hero">${botanical()}<span class="pill">${icon(state.notes.length?'book':'spark')} ${state.notes.length?'接着上次的思考':'从一个问题开始'}</span><h2>${state.notes.length?'读懂之后，<br>试着自己说一次。':'留点余地，<br>让理解慢慢生长。'}</h2><p class="meta">${state.notes.length?'学习如何学习 · 6 分钟':'留下一段文字，或一个还没想清的问题。'}</p><div class="row">${btn(`${state.notes.length?'继续学习':'留下一个新起点'} ${icon('arrow')}`,state.notes.length?'practice':'capture')}${state.notes.length?btn('先看原文','read','data-id="1"','text-btn'):''}</div></div>${budget()}${section('今日安排','study',state.notes.length?'2 项待学':'查看学习池')}${state.notes.length?agenda():`<div class="blank" style="padding:19px 0"><p>今天的安排暂时是空的。</p>${btn('从知识库选择','library','','text-btn')}</div>`}<div class="quick-pair"><button data-act="capture">${icon('plus')}<strong>随手记下</strong><span>一个问题，也值得留下</span></button><button data-act="focus">${icon('clock')}<strong>留一段专注</strong><span>给自己 25 分钟</span></button></div>`;}
function VariantB(){return `<div class="journal-date"><strong>23</strong><span>2026 年 10 月<br>星期五 · 我的手记</span><span class="grow"></span>${icon('leaf')}</div><h1 class="journal-title">今天，<br>有什么值得记住？</h1><button class="journal-prompt" data-act="capture"><span>留下一点自己的想法…</span>${icon('pen')}</button>${state.notes.length?`<div class="journal-note"><span class="eyebrow">接着昨天</span><h3>“${esc(state.notes[0].excerpt)}”</h3>${btn('打开这页手记 '+icon('arrow'),'read',`data-id="${state.notes[0].id}"`,'text-btn')}</div>`:`<div class="journal-note"><h3>第一份资料，<br>会成为下次思考的起点。</h3></div>`}<div class="journal-rule">今日 · 待理解</div>${state.notes.length?agenda():`<p class="meta" style="padding:18px 0">还没有安排，先收集一点灵感吧。</p>`}<div class="journal-footer"><span><strong>25</strong> 分钟，可以慢一点。</span>${btn('开始专注','focus','','text-btn')}</div>`;}
function VariantC(){return `<div class="focus-heading"><div class="eyebrow">OCT 23 · FRIDAY</div><h1>此刻，只学一点。</h1></div><div class="focus-orbit"><strong>${state.notes.length?'06':'25'}</strong><span>分钟</span></div><div class="focus-card"><div class="focus-symbol">${icon('spark')}</div><div class="eyebrow">${state.notes.length?'下一个小问题':'从这里开始'}</div><h2>${state.notes.length?'为什么读懂，<br>不等于记住？':'最近读到什么，<br>想再想一想？'}</h2><p>${state.notes.length?'先用自己的话说说，<br>再回到原文找依据。':'留下一段文字，<br>给下次思考一个起点。'}</p>${btn(`${state.notes.length?'开始这一小步':'留下一份资料'} ${icon('arrow')}`,state.notes.length?'practice':'capture','', 'primary wide')}</div>${section('之后再看','library','知识库')}<div class="focus-next"><button data-act="capture"><span>随手留下</span>一个新的问题 ${icon('plus')}</button><button data-act="topics"><span>沿着主题</span>学习如何学习</button></div>`;}
function capture(){const v=state.variant;return title(v==='B'?'留一页手记':v==='C'?'先把想法放在这里。':'留下一个新起点',v==='A'?'不急着整理，先保留原本的样子。':'',v==='C'?'CAPTURE / A SMALL BEGINNING':'')+`<div class="composer"><input class="title-input" id="capture-title" aria-label="资料标题" placeholder="${v==='B'?'这一页的标题…':'标题，留空也可以'}" value="${esc(state.draft.title)}"><textarea class="writing" id="capture-body" aria-label="原始资料" placeholder="一段摘录、一个问题，\n或还没想清楚的念头。">${esc(state.draft.body)}</textarea><div class="composer-tools">${btn(icon('attach')+' 添加资料','demo-import','','text-btn')}<span class="micro" id="word-count">${state.draft.body.length} 字</span></div></div><button class="disclosure" data-act="source"><span>${icon('up')} 来源信息</span>${icon(state.sourceOpen?'down':'plus')}</button>${state.sourceOpen?`<input class="source-input" id="capture-source" aria-label="来源信息" placeholder="网址、书名或作者（选填）" value="${esc(state.draft.source)}">`:''}<button class="disclosure" data-act="processing"><span>${icon('spark')} 保存后如何处理</span><span class="micro" id="processing-state">${state.draft.ai?'AI 拆解':'只保存原文'} ${icon('right')}</span></button><div class="capture-footer"><span class="micro">${icon('leaf')} 留在自己的知识里</span>${btn('保存原文 '+icon('arrow'),'save',state.draft.body.trim()?'':'disabled')}</div>${section('也可以从这里开始')}<div class="chips">${btn('一段阅读摘录','example','','secondary')}${btn('一个没想清的问题','question-example','','secondary')}</div>`;}
function noteRow(n){return `<button class="note-row" data-act="read" data-id="${n.id}"><div class="meta row">${icon(n.kind==='原始资料'?'file':'book')}${esc(n.kind)}<span class="grow"></span>${esc(n.when)}</div><h3>${esc(n.title)}</h3><p>${esc(n.excerpt)}</p><div class="note-foot"><span class="micro">${esc(n.topic)}</span>${icon('up')}</div></button>`;}
function libraryList(){let items=state.notes.filter(n=>(state.filter==='全部'||n.kind===state.filter)&&(n.title+n.body).includes(state.query));if(!items.length)return blank(state.notes.length?'暂时没有找到':'给思考，留个地方。',state.notes.length?'换个词，或看看其他分类。':'第一份资料，会成为下次思考的起点。');if(state.variant==='C'&&state.filter==='全部'&&!state.query){const n=items[0];return `<article class="library-focus"><div class="row between"><span class="eyebrow">最近停留的一页</span>${icon('bookmark')}</div><h2>${esc(n.title)}</h2><p class="meta">${esc(n.excerpt)}</p>${btn('继续阅读 '+icon('arrow'),'read',`data-id="${n.id}"`,'text-btn')}</article>${section('其他资料')}${items.slice(1).map(noteRow).join('')}`;}if(state.variant==='B')return `<div class="folio"><div class="row between"><span class="eyebrow">MY COMMONPLACE BOOK</span><span class="folio-number">${String(items.length).padStart(2,'0')}</span></div>${items.map(noteRow).join('')}</div>`;return items.map(noteRow).join('');}
function library(){return `<div class="row between">${title(state.variant==='B'?'自己的思想集':'知识库',state.variant==='A'?'想法有来处，理解有迹可循。':'')}<button class="icon-btn" data-act="capture" aria-label="收集新资料">${icon('plus')}</button></div><label class="searchbox">${icon('search')}<input id="library-search" aria-label="查找资料" placeholder="找回一个想法…" value="${esc(state.query)}"></label><div class="filters" aria-label="资料分类">${['全部','原始资料','知识','主题','错题'].map(f=>`<button data-filter="${f}" class="${state.filter===f?'active':''}">${f}</button>`).join('')}</div><div id="library-results">${libraryList()}</div>`;}
function study(){if(!state.notes.length)return title('让理解，变成自己的。')+blank('学习从一份资料开始','先收集，再用自己的话试着解释。')+row('主题学习','','layers','topics')+row('错题修正','','refresh','mistakes');const lead=state.variant==='B'?`<div class="journal-rule">01 · 今天的练习</div><h2 class="journal-title" style="font-size:27px;margin:20px 0">不看原文，<br>你会怎么解释？</h2><p class="meta" style="margin-bottom:18px">为什么读懂，不等于记住？</p>${btn('试着说一次 '+icon('arrow'),'practice')}`:state.variant==='C'?`<div class="focus-card"><div class="focus-symbol">${icon('learn')}</div><span class="eyebrow">一次有意识的回想</span><h2>合上资料，<br>让理解浮上来。</h2><p>学习如何学习 · 约 6 分钟</p>${btn('开始练习 '+icon('arrow'),'practice','','primary wide')}</div>`:`<div class="study-feature"><span class="pill">${icon('refresh')} 今天再想一遍</span><h2>不看原文，<br>你会怎么解释？</h2><p>为什么读懂，不等于记住？</p>${btn('开始练习 '+icon('arrow'),'practice')}</div>`;return title(state.variant==='C'?'慢慢理解。':'让理解，变成自己的。','',state.variant==='B'?'LEARN / IN YOUR OWN WORDS':'')+lead+`<div class="stats"><div><b>${state.completed?'1':'0'}</b><span>今日完成</span></div><div><b>${state.completed?'1':'2'}</b><span>等待练习</span></div><div><b>25<span> min</span></b><span>今日可用</span></div></div>`+row('主题学习','沿着一个问题，慢慢深入','layers','topics')+row('错题修正','回来看看上次没想清的地方','refresh','mistakes')+section('学习记录')+`<p class="meta">${state.completed?'今天 · 完成一段解释练习（演示记录）':'每次尝试，都会在这里留下一点痕迹。'}</p>`;}
function output(){return title(state.variant==='B'?'让想法，彼此照见。':'从已有的理解出发。',state.variant==='C'?'找回线索，再写出自己的表达。':'')+`<div class="composer"><textarea class="writing" id="output-goal" aria-label="问题或输出目标" placeholder="你想问什么，或写点什么？" style="min-height:130px">${esc(state.goal)}</textarea><div class="composer-tools"><div class="chips">${['回答','提纲','草稿'].map(m=>`<button data-mode="${m}" class="${state.mode===m?'active':''}">${m}</button>`).join('')}</div><button class="icon-btn clay" data-act="generate" aria-label="检索示例资料" ${state.goal.trim()?'':'disabled'}>${icon('arrow')}</button></div></div><button class="disclosure" data-act="scope"><span>取材于 <span class="clay">我的知识库</span></span>${icon('settings')}</button>${state.output?`<article class="result"><span class="pill">示例${state.mode} · 未调用 AI</span><h2>给每次记录，留一个问题。</h2><p>可以从自己的解释开始，再回到原文核对遗漏。把问题与摘录放在一起，下一次阅读时就有了起点。</p><p>这段文字用于演示输出排版，不是基于你输入生成的真实回答。</p>${btn('查看引用 · 为什么读懂，不等于记住？','read','data-id="1"','text-btn')}</article>`:`${section('试着问问')}<button class="prompt-suggestion" data-prompt="把关于学习的笔记，整理成一份提纲">把最近的笔记，连成一条线。${icon('up')}</button><button class="prompt-suggestion" data-prompt="我记录过哪些帮助理解的方法？">我对这个问题，已经知道了什么？${icon('up')}</button>${row('输出草稿','接着上次未完成的表达','pen','drafts')}`}`;}
function reader(){const n=state.notes.find(n=>n.id===state.selected)||seed[0];return `<article class="reader"><div class="row between"><span class="meta">${esc(n.kind)} · ${esc(n.topic)}</span><button class="icon-btn" data-act="bookmark" aria-label="标记这份资料">${icon('bookmark')}</button></div><h1>${esc(n.title)}</h1><div class="meta">${esc(n.when)} <span style="margin:0 9px">·</span> 约 2 分钟阅读</div><blockquote>${esc(n.excerpt)}</blockquote><div class="prose">${n.body.split('\n\n').map(p=>`<p>${esc(p).replaceAll('\n','<br>')}</p>`).join('')}</div><div class="hairline"></div><div class="micro">来源 · ${esc(n.source||'界面原型的示例资料')}</div><div class="reader-actions">${btn('合上资料，试着回答','practice')}${btn(icon('pen'),'edit','aria-label="编辑原文"','secondary')}</div></article>`;}
function session(){return `<div class="row between"><span class="eyebrow">01 / 一次解释练习</span><span class="meta">约 6 分钟</span></div><h1 class="session-question">为什么读懂一段话，<br>不一定能在需要时想起它？</h1><p class="page-intro" style="margin-bottom:22px">先按自己的理解说说。不必追求完整。</p><textarea id="study-answer" class="answerbox" aria-label="我的理解" placeholder="我觉得…">${esc(state.answer)}</textarea><div class="capture-footer">${btn('再看一眼原文','read',`data-id="${state.selected}"`,'text-btn')}${btn('留下这次理解','submit-answer',state.answer.trim()?'':'disabled')}</div>${state.submitted?`<div class="feedback"><h3>这次思考，已经留下。</h3><p>真实版本会在这里呈现有依据的反馈。当前只演示学习界面，不进行 AI 评分或掌握判定。</p>${btn('回到学习','study','','text-btn')}</div>`:''}`;}
function syncUrl(){const p=new URLSearchParams(location.search);p.set('variant',state.variant);p.set('theme',state.theme);p.set('scene',state.scene);if(location.protocol==='file:'){location.hash=p.toString();return;}history.replaceState(null,'',`${location.pathname}?${p}${location.hash}`);}
function updateChrome(){const v=variants[state.variant];document.documentElement.dataset.theme=state.theme;phone.className=`phone variant-${state.variant}`;document.querySelector('#direction-key').textContent=v.key;document.querySelector('#direction-name').textContent=`${state.variant} · ${v.name}`;document.querySelector('#direction-detail').textContent=v.detail;document.querySelector('#variant-label').innerHTML=`<strong>${state.variant}</strong>${v.name} <span style="opacity:.5;margin-left:7px">${['A','B','C'].indexOf(state.variant)+1}/3</span>`;document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('active',b.dataset.theme===state.theme));document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===state.scene));document.querySelector('#state-readout').innerHTML=`方案 <b>${state.variant} · ${v.name}</b><br>页面 <b>${names[state.page]}</b> / ${state.theme==='dark'?'深色':'浅色'}<br>资料 <b>${state.notes.length} 份示例</b><br>草稿 <b>${state.draft.body.length} 字</b> / 练习 <b>${state.completed?'1':'0'} 次</b>`;document.querySelector('#variant-label').insertAdjacentHTML('beforeend','<small>'+names[state.page]+' · '+(state.theme==='dark'?'深色':'浅色')+' · '+state.notes.length+' 份示例</small>');document.querySelector('.mobile-controls [data-act=theme]').textContent=state.theme==='dark'?'深色':'浅色';document.querySelector('.mobile-controls [data-act=scene]').textContent=state.scene==='sample'?'示例 '+state.notes.length:'空白库';syncUrl();}
function render(){updateChrome();const detail=['reader','session'].includes(state.page);document.querySelector('#phone-header').innerHTML=detail?`<button class="icon-btn" data-act="back" aria-label="返回">${icon('left')}</button><span class="crumb">${names[state.page]}</span><button class="icon-btn" data-act="settings" aria-label="更多设置">${icon('more')}</button>`:`<span class="wordmark">${icon('leaf')}${state.page==='today'?'知序':names[state.page]}</span><button class="icon-btn" data-act="settings" aria-label="打开设置">${icon('settings')}</button>`;screen.innerHTML=({today:()=>({A:VariantA,B:VariantB,C:VariantC}[state.variant]()),capture,library,study,output,reader,session}[state.page])();screen.classList.remove('enter');void screen.offsetWidth;screen.classList.add('enter');document.querySelector('#tabbar').innerHTML=[['today','今日','sun'],['capture','收集','plus'],['library','知识库','book'],['study','学习','learn'],['output','应用','pen']].map(([p,t,i])=>`<button data-page="${p}" class="${state.page===p||(p==='library'&&state.page==='reader')||(p==='study'&&state.page==='session')?'active':''}" aria-label="${t}" ${state.page===p?'aria-current="page"':''}>${icon(i)}<span>${t}</span></button>`).join('');}
function navigate(page){state.page=page;screen.scrollTop=0;closeSheet();render();}
function switchVariant(delta){const keys=['A','B','C'];state.variant=keys[(keys.indexOf(state.variant)+delta+3)%3];closeSheet();render();}
let toastTimer;function toast(message){const t=document.querySelector('#toast');clearTimeout(toastTimer);t.textContent=message;t.hidden=false;toastTimer=setTimeout(()=>t.hidden=true,2200);}
function closeSheet(){document.querySelector('#sheet-backdrop').hidden=true;}
function sheet(heading,body){document.querySelector('#sheet').innerHTML=`<div class="sheet-handle"></div><div class="row between sheet-heading"><h2 id="sheet-title">${heading}</h2><button class="icon-btn" data-act="close-sheet" aria-label="关闭">${icon('close')}</button></div>${body}`;document.querySelector('#sheet-backdrop').hidden=false;document.querySelector('#sheet .icon-btn').focus({preventScroll:true});}
function processing(){sheet('保留原文，再决定下一步',`<label class="switch-row">AI 拆解<input type="checkbox" id="process-ai" ${state.draft.ai?'checked':''}></label><label class="switch-row">拆解时联网检验<input type="checkbox" id="process-research" ${state.draft.research?'checked':''} ${state.draft.ai?'':'disabled'}></label><p class="micro" style="line-height:1.9;margin-top:20px">原型只演示选项关系，不会发送资料或调用 AI。</p>${btn('完成','close-sheet','','primary wide')}`);}
function onAction(act,el){switch(act){case'today':case'capture':case'library':case'study':case'output':navigate(act);break;case'back':navigate(state.page==='session'?'study':state.previous);break;case'read':state.selected=Number(el?.dataset.id||state.selected);state.previous=['reader','session'].includes(state.page)?'library':state.page;navigate('reader');break;case'practice':state.selected=state.selected||1;state.submitted=false;navigate('session');break;case'processing':processing();break;case'close-sheet':closeSheet();render();break;case'source':state.sourceOpen=!state.sourceOpen;render();break;case'save':if(!state.draft.body.trim())return;const n={id:Date.now(),title:state.draft.title.trim()||state.draft.body.slice(0,20),kind:'原始资料',body:state.draft.body,excerpt:state.draft.body.slice(0,52),source:state.draft.source,topic:'我的收集',when:'刚刚',minutes:5};state.notes.unshift(n);state.selected=n.id;state.previous='library';state.draft={title:'',body:'',source:'',ai:false,research:false};navigate('reader');toast('已保存到本页演示知识库');break;case'example':state.draft.body='今天读到一段很有意思的话：\n\n理解，不只是熟悉一段文字，而是能把它放进自己的生活里。\n\n我想找一个自己的例子。';state.draft.title='留一个自己的例子';render();break;case'question-example':state.draft.body='为什么有些东西看过很多遍，却仍然说不清楚？';render();break;case'demo-import':state.draft.title='一段阅读手记';state.draft.body=seed[1].body;render();toast('已加入示例文本，未读取本机文件');break;case'theme':state.theme=state.theme==='dark'?'light':'dark';render();break;case'scene':setScene(state.scene==='sample'?'empty':'sample');break;case'focus':sheet('给这一刻，留点空间。',`<div class="focus-orbit"><strong>25</strong><span>分钟</span></div><p class="meta" style="text-align:center">这一段时间，只做一件事。</p>${btn('开始专注（演示）','focus-start','','primary wide')}`);break;case'focus-start':closeSheet();toast('专注已开始（界面演示，不计时）');break;case'settings':sheet('自己的节奏',`<div class="row between"><span class="meta">外观</span><div class="chips">${btn('深色','set-dark','','secondary')}${btn('浅色','set-light','','secondary')}</div></div>${row('今日可用时间','25 分钟','clock','focus')}${row('主题学习','','layers','topics')}<p class="full-notes">网页原型 · 纯内存示例。关闭或刷新会重置资料，未连接真实账户。</p>`);break;case'set-dark':case'set-light':state.theme=act==='set-dark'?'dark':'light';closeSheet();render();break;case'topics':sheet('沿着主题，慢慢深入。',`${row('学习如何学习','3 份示例资料 · 2 个待理解问题','layers','library')}${row('阅读手记','从摘录到自己的理解','book','library')}`);break;case'mistakes':sheet('回到没想清的地方',`<div class="blank">${icon('refresh')}<h2>给“不确定”留个位置。</h2><p>练习中需要重新理解的地方，会在这里聚在一起。</p></div>`);break;case'drafts':sheet('未完成的表达',`<button class="note-row" data-prompt="整理一份学习方法提纲"><span class="meta">示例草稿 · 今天</span><h3>关于学习，我正在形成的想法</h3><p>先留下一个开头，之后慢慢展开。</p></button>`);break;case'scope':sheet('这次从哪里取材',`<label class="switch-row">我的知识<input type="checkbox" checked></label><label class="switch-row">原始资料<input type="checkbox" checked></label><label class="switch-row">允许使用外部模型<input type="checkbox" disabled></label><p class="full-notes">原型仅展示本地示例，不执行联网或模型调用。</p>${btn('完成','close-sheet','','primary wide')}`);break;case'generate':if(!state.goal.trim())return;state.output=true;render();toast('仅展示示例输出，未调用 AI');break;case'bookmark':toast('已标记（仅本页演示）');break;case'submit-answer':if(!state.answer.trim())return;state.submitted=true;state.completed=true;render();screen.querySelector('.feedback')?.scrollIntoView({behavior:'smooth',block:'nearest'});break;case'edit':const note=state.notes.find(n=>n.id===state.selected)||seed[0];sheet('编辑原文',`<input id="edit-title" class="title-input" aria-label="编辑标题" value="${esc(note.title)}"><textarea id="edit-body" class="answerbox" aria-label="编辑正文">${esc(note.body)}</textarea>${btn('保存修改','save-edit','','primary wide')}`);break;case'save-edit':let edit=state.notes.find(n=>n.id===state.selected);if(!edit){edit=structuredClone(seed[0]);state.notes.unshift(edit);}edit.title=document.querySelector('#edit-title').value||edit.title;edit.body=document.querySelector('#edit-body').value;edit.excerpt=edit.body.slice(0,52);closeSheet();render();toast('修改已保留在本页');break;}}
function setScene(scene){state.scene=scene;state.notes=scene==='sample'?structuredClone(seed):[];state.page='today';state.completed=false;state.query='';state.filter='全部';closeSheet();render();}
document.addEventListener('click',event=>{const el=event.target.closest('button');if(!el||el.disabled)return;if(el.dataset.page)return navigate(el.dataset.page);if(el.dataset.theme){state.theme=el.dataset.theme;return render();}if(el.dataset.scene)return setScene(el.dataset.scene);if(el.dataset.filter){state.filter=el.dataset.filter;return render();}if(el.dataset.mode){state.mode=el.dataset.mode;return render();}if(el.dataset.prompt){state.goal=el.dataset.prompt;state.output=false;closeSheet();return navigate('output');}if(el.dataset.act)onAction(el.dataset.act,el);});
document.addEventListener('input',event=>{const {id,value}=event.target;if(id==='capture-title')state.draft.title=value;if(id==='capture-source')state.draft.source=value;if(id==='capture-body'){state.draft.body=value;document.querySelector('#word-count').textContent=`${value.length} 字`;screen.querySelector('[data-act=save]').disabled=!value.trim();}if(id==='library-search'){state.query=value;document.querySelector('#library-results').innerHTML=libraryList();}if(id==='output-goal'){state.goal=value;screen.querySelector('[data-act=generate]').disabled=!value.trim();}if(id==='study-answer'){state.answer=value;screen.querySelector('[data-act=submit-answer]').disabled=!value.trim();}updateChrome();});
document.addEventListener('change',event=>{if(event.target.id==='process-ai'){state.draft.ai=event.target.checked;if(!state.draft.ai)state.draft.research=false;const r=document.querySelector('#process-research');r.disabled=!state.draft.ai;r.checked=state.draft.research;}if(event.target.id==='process-research')state.draft.research=state.draft.ai&&event.target.checked;});
document.querySelector('#previous-variant').onclick=()=>switchVariant(-1);document.querySelector('#next-variant').onclick=()=>switchVariant(1);
document.querySelector('#sheet-backdrop').addEventListener('click',e=>{if(e.target.id==='sheet-backdrop'){closeSheet();render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();return;}if(e.isComposing||e.keyCode===229||e.target.closest('input,textarea,[contenteditable],select'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();switchVariant(e.key==='ArrowLeft'?-1:1);}if(e.key==='Tab'&&!document.querySelector('#sheet-backdrop').hidden){const list=[...document.querySelectorAll('#sheet button:not(:disabled),#sheet input:not(:disabled),#sheet textarea')];if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0].focus();}}});
window.addEventListener('popstate',()=>{const p=new URLSearchParams(location.search);if(variants[p.get('variant')])state.variant=p.get('variant');render();});
function fitPreview(){document.documentElement.style.setProperty('--preview-scale',String(Math.min(1,Math.max(.55,(innerHeight-130)/844))));}
window.addEventListener('resize',fitPreview);fitPreview();
render();
}
</script>
</body>
</html>
